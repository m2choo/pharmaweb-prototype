<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI 복약 상담 — v3</title>
<style>
:root{
  --color-primary:#3E71F0;
  --color-white:#FFFFFF;
  --color-grey-900:#212529;
  --color-grey-800:#333D48;
  --color-grey-700:#252525;
  --color-grey-600:#666666;
  --color-grey-550:#7888AC;
  --color-grey-500:#8B95A1;
  --color-grey-400:#A9ADB9;
  --color-grey-300:#D9D9D9;
  --color-grey-250:#D1D7E0;
  --color-grey-200:#EBEBEB;
  --color-grey-150:#EEF0F3;
  --color-grey-100:#F6F6F6;
  --color-blue-200:#E3EBFF;
  --color-blue-100:#ECF1FF;
  --color-red:#EE4951;
  --color-success:#33AF2E;
  --color-warning:#FF8A00;
  --color-step-inactive:#414B5E;
}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@350;400;500;700&family=Poppins:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:transparent;min-height:100vh;}

.ai-fab{position:fixed;bottom:32px;right:32px;background:var(--color-primary);border:none;border-radius:52px;padding:18px 30px 18px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(62,113,240,.35);cursor:pointer;transition:transform .15s,box-shadow .15s;z-index:50;font-family:inherit;}
.ai-fab:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(62,113,240,.5);}
.ai-fab-icon{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-fab-text{font-size:18px;font-weight:700;color:var(--color-white);letter-spacing:-0.6px;}

/* ── BACKDROP (v2 원본 패턴 그대로) ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 0;}
.modal-overlay.on{display:flex;}
.overlay-wrap{display:flex;gap:14px;align-items:stretch;animation:mIn .2s ease;}
@keyframes mIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* component: popup — v2 modal-panel 패턴 (단계 축소판) */
.modal-panel{width:800px;flex-shrink:0;background:var(--color-white);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;min-height:723px;max-height:90vh;}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 24px 15px;border-bottom:1px solid var(--color-grey-300);flex-shrink:0;}
.modal-title{font-size:24px;font-weight:350;letter-spacing:-0.96px;color:var(--color-grey-900);}
.modal-x{width:30px;height:30px;background:none;border:none;cursor:pointer;color:var(--color-grey-500);font-size:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.modal-x:hover{background:var(--color-grey-150);}

/* v2 modal-pt 패턴: 아바타 + 이름(+수정펜, 신규만) + 정보 + 삭제(X, 녹음 전까지만) */
.modal-pt{display:flex;align-items:center;gap:12px;padding:16px 24px 0;flex-shrink:0;min-height:24px;}
.modal-pt-placeholder{font-size:16px;color:var(--color-grey-500);}
.modal-pt-avatar{width:40px;height:40px;border-radius:50%;background:var(--color-grey-150);color:var(--color-grey-500);font-size:18px;font-weight:500;letter-spacing:-0.72px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-pt-name{font-size:18px;font-weight:500;letter-spacing:-0.72px;color:var(--color-grey-700);}
.modal-pt-search-box{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;height:48px;box-sizing:border-box;padding:0 18px;border:1.5px solid var(--color-grey-300);border-radius:12px;cursor:pointer;background:var(--color-white);transition:border-color .15s,background .15s;}
.modal-pt-search-box:hover{border-color:var(--color-primary);background:var(--color-blue-100);}
.modal-pt-search-box .modal-pt-name{font-size:17px;}
.modal-pt-search-icon{display:flex;color:var(--color-grey-400);flex-shrink:0;}
.modal-pt-search-box:hover .modal-pt-search-icon{color:var(--color-primary);}
.modal-pt-name-input{flex:1;min-width:0;height:48px;padding:0 10px 0 34px;border:1.5px solid var(--color-grey-300);border-radius:12px;font-size:15px;font-weight:500;letter-spacing:-0.3px;color:var(--color-grey-800);font-family:inherit;outline:none;vertical-align:middle;background:var(--color-white);}
.modal-pt-name-input::placeholder{font-weight:400;color:var(--color-grey-400);}
.modal-pt-name-input:focus{border-color:var(--color-primary);}
.name-edit-wrap{position:relative;display:flex;align-items:center;gap:6px;width:100%;box-sizing:border-box;}
.name-edit-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-grey-400);pointer-events:none;display:flex;}
.name-edit-dropdown{position:absolute;top:48px;left:0;z-index:50;width:100%;max-height:240px;overflow-y:auto;background:var(--color-white);border:1px solid var(--color-grey-250);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);}
.name-edit-option{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;}
.name-edit-option:hover{background:var(--color-blue-100);}
.name-edit-option-avatar{width:28px;height:28px;border-radius:50%;background:var(--color-grey-150);color:var(--color-grey-500);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.name-edit-option-name{font-size:14px;font-weight:500;color:var(--color-grey-800);}
.name-edit-option-sub{font-size:12px;color:var(--color-grey-500);margin-top:1px;}
.modal-pt-info{font-size:14px;font-weight:500;letter-spacing:-0.26px;color:var(--color-grey-600);margin-left:4px;}
.modal-pt-remove{margin-left:auto;width:28px;height:28px;padding:0;background:none;border:none;border-radius:6px;color:var(--color-grey-500);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-pt-remove:hover{background:#FFF4F5;color:var(--color-red);}
/* 검색창 오른쪽에 항상 보이는 말풍선 툴팁 안내 — 호버해야만 보이던 툴팁이 눈에 잘 안 띈다는
   피드백으로 상시 노출로 바꿨고, 검색창을 가리키는 꼬리를 왼쪽에 단 말풍선 모양으로 표시 */
.modal-pt-search-stack{display:flex;flex-direction:column;flex:1;min-width:0;}
.modal-pt-search-row{display:flex;align-items:center;gap:12px;}
.modal-pt-search-row .modal-pt-avatar{flex-shrink:0;}
.modal-pt-search-row #modalPtSearchSlot{flex:1 1 380px;min-width:0;}
.modal-pt-search-label{position:relative;flex-shrink:0;background:var(--color-blue-100);color:var(--color-primary);font-size:13px;font-weight:500;padding:8px 14px;border-radius:8px;white-space:nowrap;}
.modal-pt-search-label:after{content:'';position:absolute;left:-5px;top:50%;transform:translateY(-50%);border-top:6px solid transparent;border-bottom:6px solid transparent;border-right:6px solid var(--color-blue-100);}

/* v2 step-tabs 패턴 */
.step-tabs{display:flex;margin:16px 24px 0;border-bottom:1px solid var(--color-grey-300);flex-shrink:0;}
.step-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 8px;font-size:16px;font-weight:500;letter-spacing:-0.6px;color:var(--color-step-inactive);border-bottom:2px solid transparent;white-space:nowrap;}
.step-tab.on{font-weight:700;color:var(--color-primary);border-bottom-color:var(--color-primary);}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--color-grey-200);color:var(--color-grey-500);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-tab.on .step-num{background:var(--color-primary);color:var(--color-white);}
.step-num.step-done{background:var(--color-grey-500);color:var(--color-white);font-size:11px;}

.modal-body{display:flex;flex-direction:column;padding:24px;overflow-y:auto;flex:1;min-height:0;}
.modal-ft{padding:15px 24px 20px;display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0;}

/* component: new/pharmacist-memo — 상담 중 약사가 직접 남기는 메모(가로로 넓은 카드, 즉시 수정 가능) */
.pharmacist-memo{display:flex;flex-direction:column;flex-shrink:0;border:1px solid var(--color-grey-250);border-radius:10px;padding:16px;margin-bottom:16px;}
.memo-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-shrink:0;}
.memo-hd-title{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500;color:var(--color-grey-800);}
.memo-icon{width:22px;height:22px;border-radius:50%;background:#FDEDD5;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.memo-autosave{font-size:12px;font-weight:500;color:var(--color-grey-500);background:var(--color-grey-100);padding:3px 10px;border-radius:10px;}
.memo-textarea{flex:1;min-height:40px;max-height:40px;width:100%;border:none;outline:none;resize:none;font-family:inherit;font-size:15px;line-height:1.7;color:var(--color-grey-800);}
.memo-textarea::placeholder{color:var(--color-grey-400);}
.memo-count{align-self:flex-end;font-size:12px;color:var(--color-grey-400);margin-top:8px;flex-shrink:0;}

/* component: new/med-check — 복약 점검 항목(동일 성분/상호작용/금기·주의 요약 카드) */
.med-check-section{flex-shrink:0;margin-top:10px;margin-bottom:16px;}
.med-check-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
.med-check-title{font-size:18px;font-weight:600;color:var(--color-grey-800);}
.med-check-basis{font-size:13px;color:var(--color-primary);}
.med-check-list{display:flex;flex-direction:column;gap:14px;}
.med-check-empty{text-align:center;color:var(--color-grey-400);padding:16px;}
.med-check-group-box{border:1px solid var(--color-grey-250);border-radius:8px;overflow:hidden;}
.med-check-group-label{background:#EEF0F3;color:#5F6E7D;font-size:14px;font-weight:700;letter-spacing:-0.48px;padding:8px 14px;border-bottom:1px solid var(--color-grey-250);}
.med-check-card{padding:10px 14px;border-bottom:1px solid var(--color-grey-200);font-size:15px;color:var(--color-grey-800);line-height:1.5;cursor:pointer;}
.med-check-card:last-child{border-bottom:none;}
.med-check-card b{font-weight:700;margin-right:5px;}
.med-check-card-row{display:flex;align-items:center;gap:8px;}
.med-check-card-text{flex:1;}
.med-check-chevron{flex-shrink:0;color:var(--color-grey-400);transition:transform .15s;}
.med-check-chevron.open{transform:rotate(180deg);}
.med-check-detail-wrap{margin-top:8px;}
.med-detail{border-radius:8px;padding:12px 14px;font-size:13px;line-height:1.6;}
.med-detail-line{color:var(--color-grey-700);}
.med-detail-warn{font-weight:700;}
.med-detail-caution{background:#FFF8E8;border:1px solid #FBE6B0;display:flex;gap:8px;align-items:flex-start;}
.med-detail-caution .med-detail-icon{color:#FF8A00;font-size:14px;flex-shrink:0;margin-top:1px;}
.med-detail-caution .med-detail-warn{color:var(--color-red);}

/* component: new/rx-drug-list — "처방약 상담" 선택 시에만 노출되는 처방약 정보 표 */
.rx-drug-list-section{flex-shrink:0;margin-bottom:16px;}
.rx-drug-list-title{font-size:18px;font-weight:600;color:var(--color-grey-800);margin-bottom:12px;}
.rx-drug-list-body{border:1px solid var(--color-grey-250);border-radius:8px;overflow:hidden;}
.rx-drug-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--color-grey-200);background:var(--color-white);}
.rx-drug-row:last-child{border-bottom:none;}
.rx-drug-thumb{width:40px;height:40px;border-radius:8px;background:var(--color-grey-150);display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;}
.rx-drug-thumb img{width:100%;height:100%;object-fit:cover;}
.rx-drug-info{flex:1;min-width:0;}
.rx-drug-name{font-size:15px;font-weight:500;color:var(--color-grey-800);}
.rx-drug-category{font-size:13px;color:var(--color-grey-600);margin-top:2px;}
.rx-drug-dosing{font-size:13px;color:var(--color-grey-600);white-space:nowrap;flex-shrink:0;}
.rx-drug-warnings{flex-shrink:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:2px;max-width:140px;}
.rx-drug-warnings .tag-drug-warning{margin-left:0;margin-top:0;}
.rx-drug-more-btn{width:100%;height:36px;background:var(--color-white);border:none;border-top:1px solid var(--color-grey-200);font-size:13px;font-weight:500;color:var(--color-grey-600);cursor:pointer;font-family:inherit;}

.btn-next{height:40px;padding:0 28px;background:var(--color-primary);border:none;border-radius:8px;font-size:15px;font-weight:500;letter-spacing:-0.6px;color:var(--color-white);cursor:pointer;font-family:inherit;}
.btn-next:disabled{opacity:.4;cursor:not-allowed;}
.btn-next.send{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;font-weight:700;}
.btn-back{height:40px;padding:0 20px;background:var(--color-white);border:1px solid var(--color-grey-300);border-radius:8px;font-size:15px;font-weight:500;letter-spacing:-0.6px;color:var(--color-grey-800);cursor:pointer;font-family:inherit;}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:14px;font-weight:500;color:var(--color-grey-600);}
.field label .req{color:var(--color-red);}
.field input{height:42px;border:1px solid var(--color-grey-300);border-radius:5px;padding:0 12px;font-size:16px;font-family:inherit;outline:none;color:var(--color-grey-800);}
.field input:focus{border-color:var(--color-primary);}

/* 고객 확정 후, 녹음 전 — 참고 정보 노출 (v2 카드 톤) */
.ready-note{font-size:16px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-600);line-height:1.7;}
/* component: new/rx-empty-state — 조제 가능한 처방전이 없는 상태에서 상담을 시작하는 화면 */
.rx-empty-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;text-align:center;}
.rx-empty-icon{font-size:36px;}
.rx-empty-title{font-size:16px;font-weight:500;color:var(--color-grey-800);}
.rx-empty-sub{font-size:13.5px;color:var(--color-grey-500);line-height:1.6;}
/* component: new/rx-history-panel — 행별 펼치기/처방전 원본 보기 */
.rx-history-panel{padding:14px 0;margin-bottom:14px;}
.rx-history-list{display:flex;flex-direction:column;gap:8px;}
.rx-history-item{border:1px solid var(--color-grey-250);border-radius:8px;padding:10px 12px;}
.rx-history-item.active{border-color:var(--color-primary);}
.rx-history-row{display:flex;align-items:center;gap:10px;}
.rx-history-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;}
.rx-history-check{width:16px;height:16px;accent-color:var(--color-primary);cursor:pointer;flex-shrink:0;}
.rx-history-hospital{font-size:14px;font-weight:500;color:var(--color-grey-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rx-history-day{font-size:13px;color:var(--color-grey-500);flex-shrink:0;}
.rx-history-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.rx-history-action-btn{height:28px;padding:0 10px;border:1px solid var(--color-grey-250);border-radius:6px;background:var(--color-white);color:var(--color-grey-600);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.rx-history-action-btn:hover{border-color:var(--color-primary);color:var(--color-primary);}
.rx-history-toggle-btn{width:24px;height:24px;border:none;background:none;padding:0;color:var(--color-grey-500);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s;}
.rx-history-toggle-btn:hover{color:var(--color-primary);}
.rx-history-item.open .rx-history-toggle-btn{transform:rotate(180deg);color:var(--color-primary);}
.rx-history-item-expand{max-height:0;overflow:hidden;}
.rx-history-item.open .rx-history-item-expand{max-height:640px;overflow-y:auto;margin-top:10px;padding-top:10px;border-top:1px solid var(--color-grey-200);}
/* 처방 약품 편집 테이블 (v2 s2-drug-table 포팅) */
.s2-rx-box{border:none;}
.s2-drug-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.s2-drug-table thead tr{background:#EEF0F3;}
.s2-drug-table th{padding:8px 10px;font-size:12px;font-weight:400;letter-spacing:-0.48px;color:#5F6E7D;text-align:center;border-top:1px solid var(--color-grey-250);border-bottom:1px solid var(--color-grey-250);}
.s2-drug-table th:nth-child(2){text-align:left;}
.s2-drug-table td{padding:0 10px;height:52px;font-size:14px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-800);border-bottom:1px solid var(--color-grey-200);word-break:keep-all;overflow-wrap:break-word;}
.s2-drug-table tbody tr:last-child td{border-bottom:none;}
.s2-drug-table th:nth-child(1),.s2-drug-table td:nth-child(1){width:25px;text-align:center;color:var(--color-grey-400);font-family:'Poppins',sans-serif;}
.s2-drug-table th:nth-child(2),.s2-drug-table td:nth-child(2){width:auto;}
.s2-drug-table th:nth-child(3),.s2-drug-table td:nth-child(3){width:64px;text-align:center;}
.s2-drug-table th:last-child,.s2-drug-table td:last-child{text-align:center;width:60px;}
.s2-drug-table th.th-action{width:60px;}
.s2-drug-table td.td-action{text-align:center;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:2px;}
.s2-drug-name{font-size:14px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-800);}
.s2-drug-sub{font-size:12px;font-weight:500;letter-spacing:-0.26px;color:var(--color-grey-600);margin-top:1px;}
.s2-changed-badge{display:inline-block;background:var(--color-blue-200);color:var(--color-primary);font-size:12px;font-weight:500;letter-spacing:-0.26px;padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle;}
/* 다제약물 대상자 전용 — 오늘 확인 중인 처방전 말고, 복용 기간이 남아있는 다른 처방약 참고 표.
   모달 내 테이블 규격(헤더 bg #EEF0F3 등, tokens.md "모달 내 테이블 규격" 참고)을 그대로 따름 */
.ongoing-drug-section{margin-top:16px;}
.ongoing-drug-title{font-size:13px;font-weight:500;color:var(--color-grey-600);margin-bottom:8px;}
.ongoing-drug-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.ongoing-drug-table thead tr{background:#EEF0F3;}
.ongoing-drug-table th{padding:8px 10px;height:34px;font-size:12px;font-weight:400;color:#5F6E7D;text-align:left;border-top:1px solid var(--color-grey-250);border-bottom:1px solid var(--color-grey-250);}
.ongoing-drug-table td{padding:0 10px;height:54px;font-size:15px;font-weight:400;color:var(--color-grey-800);border-bottom:1px solid var(--color-grey-200);}
.ongoing-drug-table tbody tr:last-child td{border-bottom:none;}
/* component: new/tag-drug-warning — 금기/주의 API 조회 결과 태그(단일 톤, 기존 "관리 필요" 태그 색상 재사용) */
.tag-drug-warning{display:inline-block;background:#FFF1F1;border:1px solid #F8C4C4;color:var(--color-red);font-size:11px;font-weight:500;letter-spacing:-0.22px;padding:1px 7px;border-radius:10px;margin-left:6px;margin-top:2px;vertical-align:middle;}
.s2-row-edit-btn{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--color-grey-400);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;}
.s2-row-edit-btn:hover{background:var(--color-grey-150);color:var(--color-grey-600);}
.s2-row-del-btn{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--color-grey-400);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;}
.s2-row-del-btn:hover{background:#FFF4F5;color:var(--color-red);}
.s2-add-drug-row{display:flex;align-items:center;justify-content:center;padding:10px 12px;border-top:1px dashed var(--color-grey-200);}
.s2-add-drug-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border:1.5px dashed var(--color-primary);border-radius:8px;background:var(--color-blue-100);color:var(--color-primary);font-size:14px;font-weight:500;letter-spacing:-0.6px;cursor:pointer;font-family:inherit;}
.s2-add-drug-btn:hover{background:var(--color-blue-200);}
.s2-edit-row td{background:var(--color-blue-100);padding:10px 12px;}
.s2-add-form-row td{background:var(--color-blue-100);padding:10px 12px;}
.s2-edit-form{display:flex;flex-direction:column;gap:14px;padding:12px 14px;}
.s2-edit-label{font-size:11px;font-weight:500;letter-spacing:-0.44px;color:var(--color-grey-550);margin-bottom:8px;display:block;}
.s2-edit-search{position:relative;}
.s2-edit-search input{width:100%;height:38px;border:1px solid var(--color-grey-300);border-radius:5px;padding:0 34px 0 12px;font-size:14px;font-family:inherit;outline:none;}
.s2-edit-search input:focus{border-color:var(--color-primary);}
.s2-edit-search .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--color-grey-400);display:flex;padding:0;}
.s2-edit-qty-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.s2-edit-qty-group{display:flex;flex-direction:column;gap:6px;}
.s2-edit-qty-value{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--color-grey-800);font-family:inherit;}
.s2-edit-qty-input{width:56px;height:26px;border:1px solid #CBCDD0;border-radius:5px;font-family:'Poppins',sans-serif;font-size:14px;color:var(--color-grey-800);text-align:center;outline:none;}
.s2-edit-qty-input:focus{border-color:var(--color-primary);}
.s2-edit-actions{display:flex;gap:8px;justify-content:flex-end;}
.s2-edit-save{height:32px;width:72px;background:var(--color-primary);border:none;border-radius:6px;font-size:13px;font-weight:500;color:var(--color-white);cursor:pointer;font-family:inherit;}
.s2-edit-cancel{height:32px;width:72px;background:var(--color-white);border:1px solid var(--color-primary);border-radius:6px;font-size:13px;font-weight:500;color:var(--color-primary);cursor:pointer;font-family:inherit;}
/* 대체조제 확인 패널 */
.s2-consent-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px 14px;margin-top:8px;background:rgba(238,73,81,.1);border-radius:8px;}
.s2-consent-left{display:flex;align-items:center;gap:8px;}
.s2-consent-icon{width:20px;height:20px;border-radius:50%;background:var(--color-red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.s2-consent-icon span{font-size:13px;font-weight:900;color:var(--color-white);line-height:1;}
.s2-consent-title{font-size:14px;font-weight:500;letter-spacing:-0.6px;color:var(--color-red);}
.s2-consent-sub{font-size:12px;font-weight:400;letter-spacing:-0.48px;color:var(--color-red);margin-top:4px;}
.s2-consent-radios{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.s2-consent-radio{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-600);cursor:pointer;}
.s2-consent-radio input[type="radio"]{width:14px;height:14px;accent-color:var(--color-primary);cursor:pointer;}
/* 다제약물관리사업 대상자 배너 (v2 s2-poly-alert 그대로 포팅) */
.s2-poly-alert{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(255,174,53,.15);border-radius:8px;margin-bottom:16px;}
.s2-poly-alert-icon{width:20px;height:20px;border-radius:50%;background:#FFAE35;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.s2-poly-alert-icon span{font-size:13px;font-weight:900;color:var(--color-white);line-height:1;}
.s2-poly-alert-txt{font-size:15px;font-weight:500;letter-spacing:-0.6px;color:#B56E00;}

/* 복약 상담 화면 하단 안내 문구 */
/* 탭바 바로 아래, 상단 고정 안내 스트립 — 녹음 중 다음 행동(상담 종료 버튼)을 안내. 현재 상태(녹음 중)는
   오른쪽 퍼즐 AI 패널에서 이미 보이므로 이 스트립엔 별도 상태 배너를 두지 않음 */
.consult-hint-bar{display:flex;align-items:flex-start;gap:8px;padding:12px 20px;background:var(--color-blue-100);border-bottom:1px solid var(--color-blue-100);font-size:15px;line-height:1.5;color:var(--color-primary);flex-shrink:0;}
.consult-hint-bar__icon{font-size:17px;color:var(--color-primary);flex:none;margin-top:1px;}
.consult-hint-bar__label{font-weight:600;color:var(--color-primary);}
.rec-hint-icon{height:32px;vertical-align:middle;margin:0 3px;filter:drop-shadow(0 2px 5px rgba(0,0,0,.35));}

/* 복약지도문 작성 (v2 msg-* 패턴) */
.msg-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.msg-ttl{font-size:20px;font-weight:500;letter-spacing:-0.72px;color:var(--color-grey-700);}
.msg-chk-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.msg-chk-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1.5px solid var(--color-grey-300);border-radius:20px;background:var(--color-white);font-size:15px;font-weight:600;color:var(--color-grey-600);letter-spacing:-0.4px;cursor:pointer;user-select:none;font-family:inherit;transition:border-color .12s,background .12s,color .12s;}
.msg-chk-btn.on{border-color:var(--color-primary);background:var(--color-blue-100);color:var(--color-primary);}
.msg-chk-icon{width:20px;height:20px;border-radius:5px;border:1.5px solid currentColor;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.msg-chk-icon svg{opacity:0;}
.msg-chk-btn.on .msg-chk-icon{background:var(--color-primary);border-color:var(--color-primary);}
.msg-chk-btn.on .msg-chk-icon svg{opacity:1;}
.ai-caption{font-size:13.5px;color:var(--color-grey-500);margin-bottom:10px;}
.msg-ta{width:100%;height:240px;border:1.5px solid var(--color-grey-300);border-radius:10px;padding:14px;font-size:16px;font-weight:400;line-height:27px;letter-spacing:-0.6px;color:var(--color-grey-800);resize:none;font-family:inherit;transition:border-color .15s;}
.msg-ta:focus{outline:none;border-color:var(--color-primary);}
.msg-cnt{text-align:right;font-size:13px;font-weight:400;letter-spacing:-0.48px;margin-top:6px;color:var(--color-grey-500);}

/* 복약 알림 (v2 reminder.css 그대로 포팅) */
.rm-item{width:100%;margin-bottom:16px;}
.rm-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--color-grey-250);border-radius:10px;cursor:pointer;transition:border-color .12s,background .12s;user-select:none;width:100%;box-sizing:border-box;}
.rm-row:hover{border-color:#A0B4FF;background:#FAFBFF;}
.rm-row.open{border-color:var(--color-primary);background:var(--color-blue-100);border-bottom-left-radius:0;border-bottom-right-radius:0;}
.rm-row-body{flex:1;min-width:0;overflow:hidden;}
.rm-row-top{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
.rm-row-hospital{font-size:15px;font-weight:700;color:var(--color-grey-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rm-row-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.rm-chevron{transition:transform .15s;color:var(--color-grey-500);flex-shrink:0;}
.rm-row.open .rm-chevron{transform:rotate(180deg);color:var(--color-primary);}
.rm-panel{display:none;width:100%;box-sizing:border-box;border:1.5px solid var(--color-primary);border-top:none;border-bottom-left-radius:10px;border-bottom-right-radius:10px;padding:16px 14px;}
.rm-panel.open{display:block;}
.rm-panel.disabled{opacity:.45;pointer-events:none;}
.rm-field{margin-bottom:14px;}
.rm-field:last-child{margin-bottom:0;}
.rm-field-label{font-size:13px;color:var(--color-grey-600);font-weight:600;margin-bottom:8px;}
.rm-slot-group{display:flex;gap:8px;height:36px;}
.rm-slotchip{flex:1;min-width:0;height:36px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid var(--color-grey-300);border-radius:8px;font-size:13px;color:var(--color-grey-600);cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .12s,background .12s,color .12s;background:var(--color-white);}
.rm-slotchip:hover{border-color:#A0B4FF;}
.rm-slotchip.active{border-color:var(--color-primary);background:var(--color-blue-100);color:var(--color-primary);font-weight:600;}
.rm-slot-error{font-size:11.5px;color:var(--color-red);font-weight:400;margin-left:8px;}
.rm-select{width:100%;height:36px;border:1.5px solid var(--color-grey-300);border-radius:8px;padding:0 10px;font-size:14px;color:var(--color-grey-800);font-family:inherit;background:var(--color-white);cursor:pointer;}
.rm-select:focus{border-color:var(--color-primary);outline:none;}
.rm-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.rm-3col{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:16px;align-items:start;}
.rm-date-input,.rm-days-input{border:1.5px solid var(--color-grey-300);border-radius:8px;font-size:14px;font-family:inherit;outline:none;}
.rm-date-input{width:100%;height:36px;padding:0 10px;}
.rm-date-input:focus{border-color:var(--color-primary);}
.rm-days-ctrl{display:flex;align-items:center;gap:8px;}
.rm-days-btn{width:32px;height:32px;border:1.5px solid var(--color-grey-300);border-radius:8px;background:var(--color-white);cursor:pointer;font-size:14px;color:var(--color-grey-800);font-family:inherit;}
.rm-days-btn:hover{border-color:#A5BCEC;}
.rm-days-input{width:56px;height:32px;text-align:center;}
.rm-switch{position:relative;width:38px;height:21px;flex-shrink:0;}
.rm-switch input{opacity:0;width:0;height:0;position:absolute;}
.rm-switch .rm-slider{position:absolute;inset:0;background:var(--color-grey-300);border-radius:22px;cursor:pointer;transition:.15s;}
.rm-switch .rm-slider::before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;background:var(--color-white);border-radius:50%;transition:.15s;}
.rm-switch input:checked + .rm-slider{background:var(--color-primary);}
.rm-switch input:checked + .rm-slider::before{transform:translateX(17px);}

/* 전송 (v2 sum-tbl 패턴) */
.send-summary-label{font-size:20px;font-weight:500;letter-spacing:-0.72px;color:var(--color-grey-700);margin-bottom:12px;}
.sum-tbl{width:100%;border-collapse:collapse;border-left:1px solid var(--color-grey-250);}
.sum-tbl tr{border-bottom:1px solid var(--color-grey-250);height:52px;}
.sum-tbl td{padding:13px 16px;font-size:16px;font-weight:400;letter-spacing:-0.6px;vertical-align:middle;}
.sum-tbl td:first-child{background:var(--color-grey-100);color:var(--color-grey-600);width:100px;white-space:nowrap;text-align:center;}
.sum-tbl td:last-child{color:var(--color-grey-700);font-weight:400;}
.phone-input-big{height:54px;border:1.5px solid var(--color-grey-300);border-radius:8px;padding:0 16px;font-size:22px;font-family:'Poppins','Noto Sans KR',sans-serif;font-weight:500;letter-spacing:1px;outline:none;color:var(--color-grey-800);width:100%;}
.phone-input-big:focus{border-color:var(--color-primary);}
.consent-row{display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:14px;font-weight:400;line-height:1.6;letter-spacing:-0.52px;color:var(--color-grey-600);cursor:pointer;}
.consent-row input[type="checkbox"]{width:16px;height:16px;accent-color:var(--color-primary);cursor:pointer;flex-shrink:0;margin-top:2px;}


/* 완료 (v2 cpl-wrap 패턴) */
.cpl-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px;gap:16px;text-align:center;flex:1;}
.cpl-icon{width:64px;height:64px;border-radius:50%;background:#EEFAF0;display:flex;align-items:center;justify-content:center;}
.cpl-ttl{font-size:24px;font-weight:350;letter-spacing:-0.96px;color:var(--color-grey-900);}
.cpl-sub{font-size:16px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-600);}
.btn-close-cpl{height:44px;padding:0 48px;background:var(--color-primary);border:none;border-radius:8px;font-size:15px;font-weight:500;letter-spacing:-0.6px;color:var(--color-white);cursor:pointer;font-family:inherit;}
.btn-poly-record{height:44px;padding:0 24px;background:var(--color-white);border:1.5px solid var(--color-primary);border-radius:8px;font-size:15px;font-weight:500;letter-spacing:-0.6px;color:var(--color-primary);cursor:pointer;font-family:inherit;margin-top:4px;}

/* ── 퍼즐 AI 패널 (우측) — modal_send_v2.html의 패널 디자인(이름+나이/방문정보 바/채팅형 인식 영역/마이크+입력바)을 그대로 적용 ── */
.puzzle-panel{width:360px;height:723px;max-height:90vh;flex-shrink:0;background:var(--color-white);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--color-grey-200);}
.pz-header{padding:16px 16px 10px;border-bottom:1px solid var(--color-grey-150);flex-shrink:0;}
.pz-name-row{display:flex;align-items:center;justify-content:space-between;}
.pz-name{font-size:24px;font-weight:350;letter-spacing:-0.96px;color:var(--color-grey-900);}
.pz-name-sub{font-size:15px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-600);margin-left:2px;}
.pz-sub{font-size:14px;color:var(--color-grey-500);margin-top:4px;}
.pz-visit-bar{display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:var(--color-grey-150);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:350;color:var(--color-grey-600);}
.pz-visit-dot{width:6px;height:6px;border-radius:50%;background:var(--color-primary);flex-shrink:0;}
.pz-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;}
.pz-idle{color:var(--color-grey-500);font-size:14px;text-align:center;line-height:1.7;max-width:240px;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* 웨이브 애니메이션(공용) — 왼쪽 모달 본문(신규 고객 녹음 표시)과 v3 스타일 퍼즐 패널 양쪽에서 재사용 */
.rec-wave-row{display:flex;align-items:center;justify-content:center;gap:6px;height:60px;}
.rec-wave-row span{width:6px;border-radius:3px;background:var(--color-primary);animation:pzWave 1.1s ease-in-out infinite;}
.rec-wave-row span:nth-child(1){height:18px;animation-delay:0s;}
.rec-wave-row span:nth-child(2){height:36px;animation-delay:.15s;}
.rec-wave-row span:nth-child(3){height:52px;animation-delay:.3s;}
.rec-wave-row span:nth-child(4){height:32px;animation-delay:.45s;}
.rec-wave-row span:nth-child(5){height:20px;animation-delay:.6s;}
.rec-wave-row.done span{animation-play-state:paused;opacity:.4;}
@keyframes pzWave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

/* ── QA 상태: 퍼즐 AI 패널 디자인 전환(v3 원본 vs v2 스타일) — 비교용, 좌측 모달 본문과는 무관 ── */
.qa-panel{position:fixed;top:14px;left:14px;z-index:9999;background:var(--color-grey-900);color:#fff;padding:10px 12px;border-radius:10px;font-size:12px;font-family:inherit;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);}
.qa-panel select{font-size:12px;padding:4px 6px;border-radius:6px;border:none;}
.qa-panel span{opacity:.7;white-space:nowrap;}

/* v3 원본 스타일 전용 — 하단 전체너비 "상담 종료" 버튼 */
.btn-stop{margin:14px 16px 18px;width:calc(100% - 32px);height:40px;padding:0 20px;background:var(--color-primary);border:none;border-radius:8px;font-size:15px;font-weight:700;letter-spacing:-0.6px;color:var(--color-white);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:7px;}
.btn-stop:disabled{opacity:.4;cursor:not-allowed;}

/* 녹음 중 상태 바 — 이름/방문정보 바로 아래, 채팅형 인식 영역 위 */
.pz-rec-bar{display:flex;align-items:center;gap:8px;padding:10px 16px 0;flex-shrink:0;}
.pz-rec-dot{width:7px;height:7px;border-radius:50%;background:var(--color-red);animation:blink 1s ease-in-out infinite;}
.pz-rec-label{font-size:12px;color:var(--color-grey-500);}
.pz-rec-time{margin-left:auto;font-size:12px;color:var(--color-grey-500);font-variant-numeric:tabular-nums;}

/* Puzzle AI 패널 — 녹음 중엔 STT로 대화가 채팅형으로 실시간 인식되는 모습을 보여줌 */
.pz-stt-box{flex:1;min-height:0;width:100%;overflow-y:auto;text-align:left;font-size:15px;line-height:25px;letter-spacing:-0.6px;color:var(--color-grey-800);}
.pz-stt-line{margin-bottom:10px;opacity:0;animation:sttFadeIn .3s ease forwards;}
.pz-stt-line b{color:var(--color-primary);font-weight:700;}
@keyframes sttFadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.pz-stt-cursor{display:inline-block;width:2px;height:14px;background:var(--color-primary);margin-left:2px;vertical-align:middle;animation:blink 1s step-start infinite;}
.pz-stt-writing-icon{display:block;width:auto;height:64px;margin-top:14px;margin-left:auto;cursor:pointer;}

/* 하단 마이크+입력바 — 마이크 버튼이 곧 "상담 종료" 액션 */
.pz-footer{padding:0;flex-shrink:0;}
.pz-bottom{border-top:1px solid var(--color-grey-150);}
.pz-input-row{display:flex;align-items:center;gap:8px;padding:12px 14px 16px;}
.pz-mic-btn{width:40px;height:40px;border-radius:50%;background:var(--color-primary);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:micPulse 1.5s ease-in-out infinite;font-family:inherit;}
.pz-mic-btn:disabled{opacity:.4;cursor:not-allowed;animation:none;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 3px rgba(62,113,240,.18)}50%{box-shadow:0 0 0 8px rgba(62,113,240,.05)}}
.pz-input-box{flex:1;display:flex;align-items:center;gap:6px;background:var(--color-grey-150);border:1px solid var(--color-grey-200);border-radius:20px;padding:8px 12px;}
.pz-input{flex:1;font-size:14px;color:var(--color-grey-500);}
.pz-wave{display:flex;align-items:center;gap:2px;flex-shrink:0;}
.pz-wave span{display:inline-block;width:2.5px;background:var(--color-primary);border-radius:2px;animation:pzInputWave .8s ease-in-out infinite;}
.pz-wave span:nth-child(1){height:4px;animation-delay:0s;}
.pz-wave span:nth-child(2){height:9px;animation-delay:.12s;}
.pz-wave span:nth-child(3){height:14px;animation-delay:.24s;}
.pz-wave span:nth-child(4){height:9px;animation-delay:.36s;}
.pz-wave span:nth-child(5){height:4px;animation-delay:.48s;}
@keyframes pzInputWave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}

@media (max-width: 960px){

/* 한글 초성 검색 지원 */
var CHOSUNG_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(str){
  var out = '';
  for(var i=0;i<str.length;i++){
    var code = str.charCodeAt(i) - 0xAC00;
    if(code > -1 && code < 11172){
      out += CHOSUNG_LIST[Math.floor(code / 588)];
    } else {
      out += str[i];
    }
  }
  return out;
}
function isChosungQuery(q){
  return q.length > 0 && q.split('').every(function(ch){ return CHOSUNG_LIST.indexOf(ch) > -1; });
}
/* 신규 고객 메시지엔 웰체크 앱 가입 안내를 이어붙임 — 모객 채널 */
var INVITE_LINK = 'https://wellcheck.co.kr/join?ref=pharmacy';
var PHARMACY_NAME = '웰체크약국';

/* 상담(녹음) 중 대화를 AI가 요약한 내용 — 약사가 직접 쓴 게 아니라는 걸 명확히 하기 위해 [상담 내용 요약]로 초안 하단에 덧붙임 (v2 SUMMARY_TEXT 그대로 포팅) */
var AI_SUMMARY_TEXT = '오메가3·헤모큐·임팩타민은 식후에 복용하고, 공복 시 위장 불편 가능함. 수면 부족·과다 카페인 시 효과 감소하므로 생활습관 관리 필요. 밀크시슬은 내일 12시 입고 예정이며, 방문 시 구입 가능함.';
/* 약사 메모 인풋란 데모용 기본 텍스트 — 저장된 메모가 없을 때만 채워짐(getMemoKey 기준으로 실제 저장되면 그 값이 우선) */
var DEFAULT_PHARMACIST_MEMO = '공복 시 위장 불편감 호소, 식후 복용 권장 안내함.\n최근 수면 부족·카페인 과다 섭취 언급 — 생활습관 관리 필요성 설명함.';
/* ── 복약지도문 초안 — AI 요약 내용/처방약 정보 2개 섹션을 goSummary()의 체크박스로 켜고 끌 수 있음.
   각 섹션은 해당 데이터가 실제로 있을 때만(hasRxInfoAvailable) 켠 상태로 반영됨.
   복약점검 정보는 환자에게 보내는 지도문에는 넣지 않기로 해서 제외 — 복약 상담 화면의
   "복약 점검 항목" 카드(renderPolyDrugTableHtml)는 약사 참고용으로만 남아있고 무관함 ── */
var msgIncludeSummary = true;
var msgIncludeRx = true;
function hasRxInfoAvailable(){
  return !!(selectedPatient && !selectedPatient.isNew && getSelectedRxs().length);
}
function buildRxInfoBlock(){
  var freqSlotMap = { '1일 1회': ['아침'], '1일 2회': ['아침', '저녁'], '1일 3회': ['아침', '점심', '저녁'], '1일 4회': ['아침', '점심', '저녁', '취침 전'] };
  var drugLines = [];
  var allSlots = [];
  var allTiming = '';
  var hasReminder = false;
  var ocrSlots = [];
  var idx = 1;
  getSelectedRxs().forEach(function(rx){
    var drugs = editingDrugsMap[rx.id] || rx.drugs;
    drugs.forEach(function(d){
      drugLines.push(idx++ + '. ' + d.name + ' - 1회 ' + d.dosage + ', ' + d.freq + ', ' + d.days + '일분');
      (freqSlotMap[d.freq] || []).forEach(function(s){ if(ocrSlots.indexOf(s) === -1) ocrSlots.push(s); });
    });
    var rs = reminderSettings[rx.id];
    if(rs && rs.enabled){
      hasReminder = true;
      Array.from(rs.slots).forEach(function(s){ if(allSlots.indexOf(s) === -1) allSlots.push(s); });
      if(rs.timing && !allTiming) allTiming = rs.timing;
    }
  });
  var methodSection;
  if(hasReminder){
    var scheduleCount = allSlots.length || ocrSlots.length || 1;
    var scheduleTimeStr = allSlots.length ? allSlots.join(' · ') : (ocrSlots.length ? ocrSlots.join(' · ') : '약사님이 등록한 시간');
    var scheduleTiming = allTiming || '식후 30분';
    methodSection = '담당 약사가 고객님의 처방전을 살펴보고 맞춤 복약 알림을 등록했어요.\n하루 ' + scheduleCount + '번, ' + scheduleTimeStr + ' ' + scheduleTiming + '에\n웰체크 앱에서 알림이 울리면 복약하세요.';
  } else {
    var scheduleCount2 = ocrSlots.length || 1;
    var scheduleTimeStr2 = ocrSlots.length ? ocrSlots.join(' · ') : '';
    methodSection = ocrSlots.length ? '하루 ' + scheduleCount2 + '번, ' + scheduleTimeStr2 + ' 식후 30분에 복약하세요.' : '';
  }
  var methodBlock = methodSection ? '\n\n[복약 방법]\n' + methodSection : '';
  return '[처방약 정보]\n' + drugLines.join('\n') + methodBlock;
}
function buildAiDraft(){
  var isNew = selectedPatient && selectedPatient.isNew;
  var name = (selectedPatient && selectedPatient.name) || '고객';
  var out = isNew
    ? '안녕하세요, 웰체크약국입니다.\n오늘 ' + PHARMACY_NAME + '에서 상담하신 내용을 보내드립니다.'
    : '안녕하세요, 웰체크약국입니다.\n' + name + ' 고객님, 오늘 상담하신 내용을 보내드립니다.';
  if(msgIncludeSummary) out += '\n\n[상담 내용 요약]\n' + AI_SUMMARY_TEXT;
  if(msgIncludeRx && hasRxInfoAvailable()) out += '\n\n' + buildRxInfoBlock();
  if(isNew) out += '\n\n[웰체크 앱 가입 안내]\n약사님과의 상담 내용을 보관하고 싶으신가요? 웰체크 앱에서 확인해 보세요.\n' + INVITE_LINK;
  return out + '\n';
}

/* ── 복약 알림 (v2 reminder.js 그대로 포팅, selectedRxIds 목록 대신 v3의 활성 처방전 1건 기준) ── */
var reminderSettings = {};
function parseFreqCount(freq){
  var m = /([0-9]+)\s*회/.exec(freq || '');
  return m ? parseInt(m[1], 10) : 1;
}
function defaultSlotsForTimes(n){
  if(n <= 1) return ['아침'];
  if(n === 2) return ['아침', '점심'];
  if(n === 3) return ['아침', '점심', '저녁'];
  return ['아침', '점심', '저녁', '취침전'];
}
function todayISODate(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function initReminderSettingsFor(rx){
  if(reminderSettings[rx.id]) return;
  var drugs = editingDrugsMap[rx.id] || rx.drugs;

function rmToggleExpand(id){

function rmToggleEnabled(id){

function rmSetTimes(id, n){
  var s = reminderSettings[id];
  s.times = n;
  s.slots = new Set(defaultSlotsForTimes(n));
  renderReminderCardWrap();
  refreshDraftIfUntouched();
}
function rmToggleSlot(id, slot){
  var s = reminderSettings[id];
  var errEl = document.getElementById('rmSlotError_' + id);
  if(s.slots.has(slot)){
    s.slots.delete(slot);
  } else {
    if(s.slots.size >= s.times){
      if(errEl) errEl.style.display = 'inline';
      return;
    }
    s.slots.add(slot);
  }
  if(errEl) errEl.style.display = 'none';
  renderReminderCardWrap();
  refreshDraftIfUntouched();
}
function rmSetTiming(id, val){
  reminderSettings[id].timing = val;
  renderReminderCardWrap();
  refreshDraftIfUntouched();
}
function rmSetStartDate(id, val){
  reminderSettings[id].startDate = val;
}
function rmChangeDays(id, delta){
  var s = reminderSettings[id];
  s.days = Math.max(1, (s.days || 1) + delta);

  var ts = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  var rec = {
    id: 'note_' + now.getTime() + '_' + Math.floor(Math.random() * 1000),

    gender: '-',

    status: '임시저장',
    appJoined: false,
    message: message,
    createdAt: ts,
    updatedAt: ts
  };
  var CL_NOTES_KEY = 'wcCLNotes';
  var list;
  try { list = JSON.parse(localStorage.getItem(CL_NOTES_KEY) || '[]'); } catch(e){ list = []; }
  list.push(rec);

}

function convertToExistingPatient(i){
  selectedPatient = Object.assign({}, currentMatches[i], {isNew:false});
  /* 아직 상담 종료 전이므로(진행 중인 녹음은 그대로 유지) 삭제(X)는 계속 자유롭게 가능 */
  renderModalPtBar(true);
  updatePzIdentity();
  if((selectedPatient.rxHistory || []).length){
    showInlineRxCheck();
  } else {
    selectedRxIds = [];
    applyRecordingStepLabels();
    renderMainRecordingContent();
  }
}

/* ── 녹음 중 인라인 처방전 확인 — 단골 전환 시에만 잠깐 보여주고, 확인하면 다시 메모 화면으로 복귀(녹음은 계속 진행) ── */
function showInlineRxCheck(explicitRxs){
  hadInlineRxCheck = true;
  document.getElementById('st1').innerHTML = '<span class="step-num">1</span> 처방전 확인';
  document.getElementById('st2').innerHTML = '<span class="step-num">2</span> 복약 상담';
  document.getElementById('st3').style.display = '';
  document.getElementById('st3').innerHTML = '<span class="step-num">3</span> 복약지도문 작성';
  setStep(1);

  var recentRxs = (explicitRxs && explicitRxs.length) ? explicitRxs : getMostRecentDateRxs(selectedPatient);
  selectedRxIds = recentRxs.length === 1
    ? [recentRxs[0].id]
    : recentRxs.filter(function(rx){ return !rx.guidanceSent; }).map(function(rx){ return rx.id; });
  expandedRxId = recentRxs.length === 1 ? recentRxs[0].id : null;

  var histHtml = recentRxs.length
    ? '<!-- component: new/rx-history-panel --><div class="rx-history-panel" id="rxHistoryPanel" data-figma="new/rx-history-panel">' +
        '<div class="rx-history-list" id="rxHistoryList"></div>' +
      '</div>'
    : '<div class="rx-empty-state">' +
        '<div class="rx-empty-icon">📋</div>' +
        '<div class="rx-empty-title">조제 가능한 처방전이 없습니다</div>' +
        '<div class="rx-empty-sub">처방전을 선택하지 않아도 복약 상담을 진행할 수 있습니다.</div>' +
      '</div>';

  document.getElementById('mbody').innerHTML = renderPolyAlertHtml(selectedPatient) + histHtml +
    renderOngoingDrugsHtml(selectedPatient, recentRxs.map(function(rx){ return rx.id; }));
  /* 상담 유형 분기(일반·건강 상담 vs 처방약 상담) — 처방전이 없으면 "처방약 상담"이 성립하지
     않으므로 "일반·건강 상담" 버튼만 남김 */
  document.getElementById('mfoot').innerHTML = recentRxs.length
    ? '<button class="btn-back" onclick="confirmRxCheckNone()">일반·건강 상담</button>' +
      '<!-- component: button/solid --><button class="btn-next" data-figma="button/solid" onclick="confirmRxCheckWithRx()">처방약 상담</button>'
    : '<button class="btn-back" onclick="confirmRxCheckNone()">일반·건강 상담</button>';

  if(recentRxs.length){
    renderRxHistoryPanel();
  }
}
function confirmRxCheckWithRx(){
  applyPostRxCheckStepLabels();
  renderMainRecordingContent();
  if(pendingStartRecording){ pendingStartRecording = false; startRecordingEngine(); }
}
function confirmRxCheckNone(){
  selectedRxIds = [];
  applyPostRxCheckStepLabels();
  renderMainRecordingContent();
  if(pendingStartRecording){ pendingStartRecording = false; startRecordingEngine(); }
}
/* 접수 처방전 목록(openModalAtStep2)처럼 녹음이 아직 시작 안 된 상태로 처방전 확인부터 보여줘야
   하는 경우에만 true — 확인이 끝나는 시점(confirmRxCheckWithRx/None)에 그때 녹음을 시작시킨다 */
var pendingStartRecording = false;
/* 처방전 확인을 거친 단골은 확인 후에도 3단계를 유지 — ①는 숫자 그대로 유지,
   ②(복약 상담)가 현재 단계가 됨 */
function applyPostRxCheckStepLabels(){
  document.getElementById('st1').innerHTML = '<span class="step-num step-done">1</span> 처방전 확인';
  document.getElementById('st2').innerHTML = '<span class="step-num">2</span> 복약 상담';
  document.getElementById('st3').style.display = '';
  document.getElementById('st3').innerHTML = '<span class="step-num">3</span> 복약지도문 작성';
  setStep(2);
}

/* ── 고객 정보 바 (v2 modal-pt 패턴: 아바타 + 이름(+수정, 신규만) + 정보 + 삭제(녹음 전까지)) ── */
function renderModalPtBar(showRemove){
  ptShowRemove = showRemove;
  var pt = document.getElementById('modalPt');
  var removeBtn = showRemove ? '<button class="modal-pt-remove" onclick="removePatient()" title="선택 취소">'+REMOVE_ICON+'</button>' : '';
  if(selectedPatient.name){
    if(selectedPatient.isNew){
      pt.innerHTML =
        '<div class="modal-pt-search-stack">' +
          '<div class="modal-pt-search-row">' +
            '<div class="modal-pt-avatar">'+selectedPatient.name[0]+'</div>' +
            '<div id="modalPtSearchSlot">' + patientSearchBoxHtml(selectedPatient.name) + '</div>' +
            '<div class="modal-pt-search-label">단골 고객을 검색할 수 있습니다</div>' +
          '</div>' +
        '</div>' + removeBtn;
    } else {
      pt.innerHTML =
        '<div class="modal-pt-avatar">'+selectedPatient.name[0]+'</div>' +
        '<div><span class="modal-pt-name">'+selectedPatient.name+'</span><span class="modal-pt-info">'+selectedPatient.phone+'</span></div>' + removeBtn;
    }
  } else {
    pt.innerHTML =
      '<div class="modal-pt-search-stack">' +
        '<div class="modal-pt-search-row">' +
          '<div class="modal-pt-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#8B95A1" stroke-width="1.8"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" stroke="#8B95A1" stroke-width="1.8" stroke-linecap="round"/></svg></div>' +
          '<div id="modalPtSearchSlot">' + patientSearchBoxHtml('신규 고객') + '</div>' +
          '<div class="modal-pt-search-label">단골 고객을 검색할 수 있습니다</div>' +
        '</div>' +
      '</div>' + removeBtn;
  }
}
function patientSearchBoxHtml(label){
  return '<div class="modal-pt-search-box" onclick="startEditName()" title="고객 검색">' +
    '<span class="modal-pt-name">'+label+'</span>' +
    '<span class="modal-pt-search-icon">'+SEARCH_ICON+'</span>' +

}
/* 이름 수정을 검색처럼 동작하게 함 — 입력하면 기존 고객 목록에서 매칭되는 결과를 드롭다운으로 보여주고,
   그 중 하나를 고르면 단골로 전환(convertToExistingPatient), 매칭 없이 그냥 입력해 확인하면 신규 고객의 이름만 바뀜.
   #modalPtSearchSlot만 바꿔치기해서 아바타/삭제 버튼은 그대로 유지(전에는 modalPt 전체를 지워서 아바타가 사라졌었음) */
function startEditName(){
  document.getElementById('modalPtSearchSlot').innerHTML =
    '<div class="name-edit-wrap">' +
      '<span class="name-edit-icon"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>' +
      '<input id="ptNameInput" class="modal-pt-name-input" value="" placeholder="이름, 초성, 전화번호, 생년월일로 검색할 수 있습니다" oninput="onNameEditSearch(this.value)" onkeydown="if(event.key===\'Enter\')commitEditName()" autocomplete="off">' +
      '<div class="name-edit-dropdown" id="nameEditDropdown" style="display:none"></div>' +
    '</div>';
  document.getElementById('ptNameInput').focus();
}
function onNameEditSearch(q){
  q = q.trim();
  var dd = document.getElementById('nameEditDropdown');
  if(!q){ dd.style.display = 'none'; dd.innerHTML = ''; currentMatches = []; return; }
  var qDigits = q.replace(/-/g,'');
  var qIsChosung = isChosungQuery(q);
  currentMatches = PATIENTS.filter(function(p){
    if(p.name.indexOf(q) > -1) return true;
    if(p.phone.replace(/-/g,'').indexOf(qDigits) > -1) return true;
    if(p.birth.replace(/-/g,'').indexOf(qDigits) > -1) return true;
    if(qIsChosung && getChosung(p.name).indexOf(q) > -1) return true;
    return false;
  });
  if(!currentMatches.length){ dd.style.display = 'none'; dd.innerHTML = ''; return; }
  dd.style.display = '';
  dd.innerHTML = currentMatches.map(function(p, i){
    return '<div class="name-edit-option" onclick="convertToExistingPatient('+i+')">' +
      '<span class="name-edit-option-avatar">'+p.name[0]+'</span>' +
      '<div><div class="name-edit-option-name">'+p.name+'</div><div class="name-edit-option-sub">'+p.phone+' · '+p.birth+'</div></div>' +
    '</div>';
  }).join('');
}
/* 확정된 이름을 지우고 새로 타이핑하게 하는 대신, 검색 모드로 들어가면 입력칸을 비워두고 검색
   방법을 placeholder로 안내 — 아무것도 입력하지 않고 확인/엔터하면 기존 이름(닉네임 등)을 그대로 유지.
   단, "상담 종료" 이후(consultCompleted)에 실제로 이름을 바꾸려 하면 지금까지 녹음된 내용은 임시저장하고
   새 고객으로 리셋 — 이미 생성된 요약/초안이 바뀐 이름과 안 맞게 되는 걸 막기 위함 */
function commitEditName(){
  var v = document.getElementById('ptNameInput').value.trim();
  if(consultCompleted && v && v !== selectedPatient.name){
    if(!confirm('지금 이름을 바꾸면 지금까지 있던 녹음된 내용은 임시저장되고, 새로 녹음이 시작됩니다. 계속할까요?')){
      renderModalPtBar(ptShowRemove);
      return;
    }
    saveTempNoteOnClose();
    resetFlow();
    startAsNew();
    return;
  }
  selectedPatient.name = v || selectedPatient.name;
  renderModalPtBar(ptShowRemove);
  updatePzIdentity();
}
function removePatient(){
  if(consultCompleted){
    if(!confirm('지금 삭제하면 지금까지 있던 녹음된 내용은 임시저장되고, 새로 녹음이 시작됩니다. 계속할까요?')) return;
    saveTempNoteOnClose();
  }
  resetFlow();
  startAsNew();
}

/* ── "처방약 상담" 선택 시 노출하는 처방약 정보 표 — 약 이름 → 분류(약효분류) 매핑, mock 데이터에
   등장하는 약품명 기준 (실제 서비스라면 의약품 DB 연동 대상) ── */
var DRUG_CATEGORY_MAP = {
  '아모잘탄정':'고혈압치료제', '아토르바스타틴':'고지혈증치료제', '리피토정':'고지혈증치료제',
  '메트포르민':'당뇨병용제', '글루코파지정':'당뇨병용제', '지르텍정':'항히스타민제',
  '오메프라졸':'소화성궤양용제', '아스피린':'항혈전제', '실로스타졸':'항혈소판제',
  '용각산':'진해거담제', '낙센정':'소염진통제', '메코발라민':'말초신경병증치료제',
  '뮤코펙트시럽':'거담제', '아세트아미노펜':'해열진통제'
};
/* 약사님이 제공한 실제 약 사진(약학정보원 KPIC 출처) — 등록된 약품만 실물 사진, 나머지는 자리표시 아이콘 */
var DRUG_IMAGE_MAP = {
  '아모잘탄정':'amosartan.jpg', '아토르바스타틴':'atorvastatin.jpg', '메트포르민':'metformin.jpg'
};
/* ── 처방전 이력 패널: 가장 최근 방문(날짜)에 발급된 처방전만 노출, 같은 날 여러 건이면 체크박스로 다건 선택 ── */
var expandedRxId = null;
function getSelectedRxs(){
  var hist = (selectedPatient && selectedPatient.rxHistory) || [];
  return selectedRxIds.map(function(id){ return hist.find(function(r){ return r.id === id; }); }).filter(Boolean);
}
function getMostRecentDateRxs(patient){
  var hist = (patient && patient.rxHistory) || [];
  if(!hist.length) return [];
  var maxDate = hist.reduce(function(max, rx){ return rx.date > max ? rx.date : max; }, hist[0].date);
  return hist.filter(function(rx){ return rx.date === maxDate; });
}
/* 다제약물관리사업 대상자 배너 — 약사가 처방전을 따로 선택하지 않아도 최근 6개월 처방 이력을 시스템이 자동 계산해서 노출 (10종 이상 약물을 180일 이상 처방) */
function getPolyQualifyingDrugs(patient){
  var hist = (patient && patient.rxHistory) || [];
  var cutoff = new Date(todayISODate());
  cutoff.setMonth(cutoff.getMonth() - 6);
  var list = [];
  hist.forEach(function(rx){
    if(new Date(rx.date) < cutoff) return;
    rx.drugs.forEach(function(d){
      if(d.days >= 180) list.push({ name: d.name, hospital: rx.hospital, date: rx.date, days: d.days });
    });
  });
  return list;
}
function computePolyQualifyingCount(patient){
  return getPolyQualifyingDrugs(patient).length;
}
/* ── 다제약물 상담기록지(poly_consult_record_v3.html) 연동 — 다제약물 대상 추정(10종 이상 90일 이상
   처방)인 경우에만, 복약지도문 발송 완료 시점에 상담기록지 초안을 생성해 localStorage(wcPolyRecords)에
   남김. "관련 요인" 체크박스는 처방 이력을 근거로 기본값만 채워두고, 실제 화면에서 약사가 직접 수정함 ── */
var POLY_RECORD_FACTORS = [
  { key: 'tenPlus', label: '10종 이상 약제 복용' },
  { key: 'narcotic', label: '마약성 진통제' },
  { key: 'tca', label: '삼환계항우울제' },
  { key: 'cns3', label: '3종 이상 중추신경계 억제 약물' },
  { key: 'anticholinergic2', label: '2종 이상 항콜린성 약제' },
  { key: 'nsaid2', label: 'NSAIDs 2종' },
  { key: 'digoxin', label: '디고신' },
  { key: 'anticoagulant', label: '항응고제' },
  { key: 'cardio3', label: '3종 이상 심혈관계 약제' },
  { key: 'insulin', label: '인슐린' },
  { key: 'oral3', label: '3종 이상 경구혈당강하제' },
  { key: 'steroidLong', label: '장기간 코르티코스테로이드 사용' }
];
var POLY_RECORD_PLAN_ROWS = [
  { key: 'dispose', label: '폐기필요 의약품', placeholder: '예) OO정 외 O종', interventions: ['회수', '별도 구분함'] },
  { key: 'storage', label: '약물보관법', placeholder: '예) 별도 보관장소 없음, 인슐린 냉장 보관 등', interventions: ['교육'] },
  { key: 'adherence', label: '복약순응도', placeholder: '예) 해당 의약품명', interventions: ['교육', '환자를 통해 의료진 알림'] },
  { key: 'interactionOtc', label: '처방약물-일반의약품 상호작용', placeholder: '예) 해당 의약품명', interventions: ['교육', '의료진 알림'] },
  { key: 'interactionFood', label: '약물-음식 상호작용', placeholder: '예) 해당 의약품명', interventions: ['교육', '의료진 알림'] },
  { key: 'interactionDisease', label: '약물-질환 상호작용', placeholder: '예) 해당 의약품명-질환', interventions: ['교육', '의료진 알림'] },
  { key: 'etc', label: '기타', placeholder: '명시되지 않은 중재 사항을 간단히 기술', interventions: ['교육', '의료진 알림'] }
];
/* 처방 이력만으로 판단 가능한 요인만 기본 체크 — 나머지(마약성 진통제 등)는 목업 약품 분류에 없어
   항상 false로 두고, 약사가 상담기록지 화면에서 직접 체크하도록 함 */
function computePolyDefaultFactors(patient){
  var drugs = getPolyQualifyingDrugs(patient);
  var categoryCount = {};
  drugs.forEach(function(d){
    var cat = DRUG_CATEGORY_MAP[d.name] || '';
    categoryCount[cat] = (categoryCount[cat] || 0) + 1;
  });
  var cardioCount = (categoryCount['고혈압치료제'] || 0) + (categoryCount['고지혈증치료제'] || 0);
  var factors = {};
  POLY_RECORD_FACTORS.forEach(function(f){ factors[f.key] = false; });
  factors.tenPlus = drugs.length >= 10;
  factors.anticoagulant = !!(categoryCount['항혈전제'] || categoryCount['항혈소판제']);
  factors.cardio3 = cardioCount >= 3;
  factors.oral3 = (categoryCount['당뇨병용제'] || 0) >= 3;
  return factors;
}
function buildPolyRecordPlanDefaults(){
  var plan = {};
  POLY_RECORD_PLAN_ROWS.forEach(function(row){
    plan[row.key] = { detail: '', interventions: {} };
  });
  return plan;
}
/* 복약지도문 발송 완료 시점 호출 — 다제약물 대상일 때만 상담기록지를 새로 만들어 저장하고, id를
   lastPolyRecordId에 남겨 완료 화면의 "다제약물 상담기록지 확인" 버튼이 그 기록으로 바로 이동하게 함 */
var lastPolyRecordId = null;
function savePolyRecordIfQualifying(){
  lastPolyRecordId = null;
  if(!selectedPatient || computePolyQualifyingCount(selectedPatient) < 10) return;
  var now = new Date();
  var pad = function(n){ return String(n).padStart(2, '0'); };
  var ts = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  var dateOnly = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
  var ongoingDates = {};
  getOngoingOtherDrugs(selectedPatient, getSelectedRxs().map(function(rx){ return rx.id; })).forEach(function(r){ ongoingDates[r.date] = true; });
  var rec = {
    id: 'poly_' + now.getTime() + '_' + Math.floor(Math.random() * 1000),
    name: selectedPatient.name,
    phone: selectedPatient.phone || '',
    birth: selectedPatient.birth || null,
    createdAt: ts,
    consultDate: dateOnly,
    consultMethod: 'visit',
    pharmacist: '김체크 약사',
    rxCount: Object.keys(ongoingDates).length,
    factors: computePolyDefaultFactors(selectedPatient),
    plan: buildPolyRecordPlanDefaults(),
    followup: { none: false, weeks: false, months: false },
    followupMethod: { visit: true, home: false, phone: false }
  };
  var KEY = 'wcPolyRecords';
  var list;
  try { list = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ list = []; }
  list.push(rec);
  localStorage.setItem(KEY, JSON.stringify(list));
  lastPolyRecordId = rec.id;
}

var DRUG_INTERACTIONS = [
  { drugs: ['아스피린', '실로스타졸'], desc: '출혈 위험 증가',

];

   자기 자신이 곧 같은 성분이므로 별도 매핑 불필요) */
var DRUG_INGREDIENT = {
  '아토르바스타틴': '아토르바스타틴', '리피토정': '아토르바스타틴',
  '메트포르민': '메트포르민', '글루코파지정': '메트포르민'
};
/* 같은 약품명이 처방된 두 건의 실제 복약 기간(처방일 ~ 처방일+일수)이 겹칠 때만 "중복 성분"으로
   판정 — 단순히 같은 약을 여러 번 처방받은 것(예: 순차적인 재처방/리필)은 겹치는 기간이 없으면
   중복 복용이 아니므로 제외해야 함 */
function medPeriodsOverlap(a, b){
  var aStart = new Date(a.date);
  var aEnd = new Date(a.date); aEnd.setDate(aEnd.getDate() + a.days);
  var bStart = new Date(b.date);
  var bEnd = new Date(b.date); bEnd.setDate(bEnd.getDate() + b.days);
  return aStart < bEnd && bStart < aEnd;
}

/* 각주 목록 생성 — 상호작용/금기·주의는 mock 페어에서, 중복 성분은 같은 주성분(상품명이 달라도
   DRUG_INGREDIENT로 매핑되는 성분 기준)의 복약 기간이 겹치는 경우에만 자동 판정 */
function buildPolyFootnotes(drugs){
  var names = drugs.map(function(d){ return d.name; });
  var footnotes = [];
  var byIngredient = {};
  drugs.forEach(function(d){
    var key = DRUG_INGREDIENT[d.name] || d.name;
    (byIngredient[key] = byIngredient[key] || []).push(d);
  });
  Object.keys(byIngredient).forEach(function(key){
    var entries = byIngredient[key];
    if(entries.length < 2) return;
    var overlapping = [];
    for(var i = 0; i < entries.length; i++){
      for(var j = i + 1; j < entries.length; j++){
        if(medPeriodsOverlap(entries[i], entries[j])){
          if(overlapping.indexOf(entries[i]) === -1) overlapping.push(entries[i]);
          if(overlapping.indexOf(entries[j]) === -1) overlapping.push(entries[j]);
        }
      }
    }
    if(!overlapping.length) return;
    var drugNames = overlapping.map(function(d){ return d.name; }).filter(function(n, i, arr){ return arr.indexOf(n) === i; });
    var dates = overlapping.map(function(d){ return d.date; }).filter(function(d, i, arr){ return arr.indexOf(d) === i; });
    footnotes.push({ type: 'duplicate', html: '<b>' + drugNames.join(' + ') + '</b> 동일 성분 중복 처방 (' + dates.join(', ') + ')', detail: buildDuplicateDetailHtml(drugNames) });
  });
  DRUG_INTERACTIONS.forEach(function(it){
    if(it.drugs.every(function(d){ return names.indexOf(d) > -1; })){
      var dates = drugs.filter(function(d){ return it.drugs.indexOf(d.name) > -1; }).map(function(d){ return d.date; }).filter(function(d, i, arr){ return arr.indexOf(d) === i; });
      footnotes.push({ type: 'interaction', html: '<b>' + it.drugs.join(' + ') + '</b> ' + it.desc + ' (' + dates.join(', ') + ')', detail: buildInteractionDetailHtml(it) });
    }
  });
  DRUG_CAUTIONS.forEach(function(it){
    if(it.drugs.every(function(d){ return names.indexOf(d) > -1; })){
      var dates = drugs.filter(function(d){ return it.drugs.indexOf(d.name) > -1; }).map(function(d){ return d.date; }).filter(function(d, i, arr){ return arr.indexOf(d) === i; });
      footnotes.push({ type: 'caution', html: '<b>' + it.drugs.join(' + ') + '</b> ' + it.desc + ' (' + dates.join(', ') + ')', detail: buildCautionDetailHtml(it) });
    }
  });
  return footnotes;
}
