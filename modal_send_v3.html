<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>AI 복약 상담 — v3</title>
<style>
:root{
  --color-primary:#3E71F0;
  --color-white:#FFFFFF;
  --color-grey-900:#212529;
  --color-grey-800:#333D48;
  --color-grey-700:#252525;
  --color-grey-600:#666666;
  --color-grey-550:#7888AC;
  --color-grey-500:#8B95A1;
  --color-grey-400:#A9ADB9;
  --color-grey-300:#D9D9D9;
  --color-grey-250:#D1D7E0;
  --color-grey-200:#EBEBEB;
  --color-grey-150:#EEF0F3;
  --color-grey-100:#F6F6F6;
  --color-blue-200:#E3EBFF;
  --color-blue-100:#ECF1FF;
  --color-red:#EE4951;
  --color-success:#33AF2E;
  --color-warning:#FF8A00;
  --color-step-inactive:#414B5E;
}
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@350;400;500;700&family=Poppins:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--color-grey-100);min-height:100vh;}

.ai-fab{position:fixed;bottom:32px;right:32px;background:var(--color-primary);border:none;border-radius:44px;padding:14px 24px 14px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(62,113,240,.35);cursor:pointer;transition:transform .15s,box-shadow .15s;z-index:50;font-family:inherit;}
.ai-fab:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(62,113,240,.5);}
.ai-fab-icon{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-fab-text{font-size:15px;font-weight:700;color:var(--color-white);letter-spacing:-0.6px;}

/* ── BACKDROP (v2 원본 패턴 그대로) ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 0;}
.modal-overlay.on{display:flex;}
.overlay-wrap{display:flex;gap:14px;align-items:stretch;animation:mIn .2s ease;}
@keyframes mIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* component: popup — v2 modal-panel 패턴 (단계 축소판) */
.modal-panel{width:800px;flex-shrink:0;background:var(--color-white);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;min-height:723px;max-height:90vh;}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 24px 15px;border-bottom:1px solid var(--color-grey-300);flex-shrink:0;}
.modal-title{font-size:24px;font-weight:350;letter-spacing:-0.96px;color:var(--color-grey-900);}
.modal-x{width:30px;height:30px;background:none;border:none;cursor:pointer;color:var(--color-grey-500);font-size:18px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:inherit;}
.modal-x:hover{background:var(--color-grey-150);}

/* v2 modal-pt 패턴: 아바타 + 이름(+수정펜, 신규만) + 정보 + 삭제(X, 녹음 전까지만) */
.modal-pt{display:flex;align-items:center;gap:12px;padding:16px 24px 0;flex-shrink:0;min-height:24px;}
.modal-pt-placeholder{font-size:16px;color:var(--color-grey-500);}
.modal-pt-avatar{width:40px;height:40px;border-radius:50%;background:var(--color-grey-150);color:var(--color-grey-500);font-size:18px;font-weight:500;letter-spacing:-0.72px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-pt-name{font-size:18px;font-weight:500;letter-spacing:-0.72px;color:var(--color-grey-700);}
.modal-pt-name-edit{width:22px;height:22px;padding:0;margin-left:2px;background:none;border:none;border-radius:5px;color:var(--color-grey-400);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;}
.modal-pt-name-edit:hover{background:var(--color-blue-100);color:var(--color-primary);}
.modal-pt-name-input{width:110px;height:26px;padding:0 6px;border:1.5px solid var(--color-primary);border-radius:5px;font-size:18px;font-weight:500;letter-spacing:-0.72px;color:var(--color-grey-700);font-family:inherit;outline:none;vertical-align:middle;}
.modal-pt-info{font-size:14px;font-weight:500;letter-spacing:-0.26px;color:var(--color-grey-600);margin-left:4px;}
.modal-pt-remove{margin-left:auto;width:28px;height:28px;padding:0;background:none;border:none;border-radius:6px;color:var(--color-grey-500);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.modal-pt-remove:hover{background:#FFF4F5;color:var(--color-red);}

/* v2 step-tabs 패턴 */
.step-tabs{display:flex;margin:16px 24px 0;border-bottom:1px solid var(--color-grey-300);flex-shrink:0;}
.step-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 8px;font-size:16px;font-weight:500;letter-spacing:-0.6px;color:var(--color-step-inactive);border-bottom:2px solid transparent;white-space:nowrap;}
.step-tab.on{font-weight:700;color:var(--color-primary);border-bottom-color:var(--color-primary);}
.step-num{width:20px;height:20px;border-radius:50%;background:var(--color-grey-200);color:var(--color-grey-500);font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-tab.on .step-num{background:var(--color-primary);color:var(--color-white);}

.modal-body{display:flex;flex-direction:column;padding:24px;overflow-y:auto;flex:1;min-height:0;}
.modal-ft{padding:15px 24px 20px;display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0;}

.btn-next{height:40px;padding:0 28px;background:var(--color-primary);border:none;border-radius:8px;font-size:15px;font-weight:500;letter-spacing:-0.6px;color:var(--color-white);cursor:pointer;font-family:inherit;}
.btn-next:disabled{opacity:.4;cursor:not-allowed;}
.btn-next.send{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;font-weight:700;}
.btn-back{height:40px;padding:0 20px;background:var(--color-white);border:1px solid var(--color-grey-300);border-radius:8px;font-size:15px;font-weight:500;letter-spacing:-0.6px;color:var(--color-grey-800);cursor:pointer;font-family:inherit;}

/* 고객 검색 (v2 search/default 패턴) */
.field-col{display:flex;flex-direction:column;gap:14px;flex:1;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:14px;font-weight:500;color:var(--color-grey-600);}
.field label .req{color:var(--color-red);}
.field input{height:42px;border:1px solid var(--color-grey-300);border-radius:5px;padding:0 12px;font-size:16px;font-family:inherit;outline:none;color:var(--color-grey-800);}
.field input:focus{border-color:var(--color-primary);}
/* component: search/default */
.s1-search-wrap{position:relative;}
.s1-search-wrap input{width:100%;height:44px;border:1px solid var(--color-grey-300);border-radius:5px;padding:0 36px 0 12px;font-size:16px;font-family:inherit;outline:none;color:var(--color-grey-800);}
.s1-search-wrap input::placeholder{color:var(--color-grey-400);}
.s1-search-wrap input:focus{border-color:var(--color-primary);}
.s1-search-icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--color-grey-400);pointer-events:none;}
.s1-results{display:flex;flex-direction:column;gap:8px;}
.s1-result-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--color-grey-250);border-radius:8px;cursor:pointer;transition:background .1s,border-color .1s;}
.s1-result-item:hover{background:var(--color-blue-100);border-color:var(--color-primary);}
.s1-result-avatar{width:36px;height:36px;border-radius:50%;background:var(--color-grey-150);color:var(--color-grey-500);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.s1-result-name{font-size:16px;font-weight:500;letter-spacing:-0.6px;color:var(--color-grey-700);}
.s1-result-phone{font-size:13px;font-weight:400;color:var(--color-grey-600);margin-top:2px;font-family:'Poppins','Noto Sans KR',sans-serif;}
.s1-empty{font-size:14px;color:var(--color-grey-500);}
.s1-divider{display:flex;align-items:center;gap:10px;color:var(--color-grey-400);font-size:12px;}
.s1-divider::before,.s1-divider::after{content:"";flex:1;height:1px;background:var(--color-grey-200);}
.s1-new-btn{height:46px;border:1.5px dashed var(--color-grey-250);border-radius:8px;background:var(--color-grey-100);color:var(--color-grey-600);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;}
.s1-new-btn:hover{background:var(--color-blue-100);border-color:var(--color-primary);color:var(--color-primary);}

/* 고객 확정 후, 녹음 전 — 참고 정보 노출 (v2 카드 톤) */
.ready-note{font-size:16px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-600);line-height:1.7;}
/* component: new/rx-empty-state — 조제 가능한 처방전이 없는 상태에서 상담을 시작하는 화면 */
.rx-empty-state{display:flex;flex-direction:column;align-items:center;gap:8px;padding:40px 20px;text-align:center;}
.rx-empty-icon{font-size:36px;}
.rx-empty-title{font-size:16px;font-weight:500;color:var(--color-grey-800);}
.rx-empty-sub{font-size:13.5px;color:var(--color-grey-500);line-height:1.6;}
/* component: new/rx-history-panel — 행별 펼치기/처방전 원본 보기 */
.rx-history-panel{padding:14px 0;margin-bottom:14px;}
.rx-history-list{display:flex;flex-direction:column;gap:8px;}
.rx-history-item{border:1px solid var(--color-grey-250);border-radius:8px;padding:10px 12px;}
.rx-history-item.active{border-color:var(--color-primary);}
.rx-history-row{display:flex;align-items:center;gap:10px;}
.rx-history-main{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer;}
.rx-history-check{width:16px;height:16px;accent-color:var(--color-primary);cursor:pointer;flex-shrink:0;}
.rx-history-hospital{font-size:14px;font-weight:500;color:var(--color-grey-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rx-history-day{font-size:13px;color:var(--color-grey-500);flex-shrink:0;}
.rx-history-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.rx-history-action-btn{height:28px;padding:0 10px;border:1px solid var(--color-grey-250);border-radius:6px;background:var(--color-white);color:var(--color-grey-600);font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.rx-history-action-btn:hover{border-color:var(--color-primary);color:var(--color-primary);}
.rx-history-toggle-btn{width:24px;height:24px;border:none;background:none;padding:0;color:var(--color-grey-500);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s;}
.rx-history-toggle-btn:hover{color:var(--color-primary);}
.rx-history-item.open .rx-history-toggle-btn{transform:rotate(180deg);color:var(--color-primary);}
.rx-history-item-expand{max-height:0;overflow:hidden;}
.rx-history-item.open .rx-history-item-expand{max-height:640px;overflow-y:auto;margin-top:10px;padding-top:10px;border-top:1px solid var(--color-grey-200);}
/* 처방 약품 편집 테이블 (v2 s2-drug-table 포팅) */
.s2-rx-box{border:none;}
.s2-drug-table{width:100%;border-collapse:collapse;table-layout:fixed;}
.s2-drug-table thead tr{background:#EEF0F3;}
.s2-drug-table th{padding:8px 10px;font-size:12px;font-weight:400;letter-spacing:-0.48px;color:#5F6E7D;text-align:center;border-top:1px solid var(--color-grey-250);border-bottom:1px solid var(--color-grey-250);}
.s2-drug-table th:nth-child(2){text-align:left;}
.s2-drug-table td{padding:0 10px;height:52px;font-size:14px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-800);border-bottom:1px solid var(--color-grey-200);word-break:keep-all;overflow-wrap:break-word;}
.s2-drug-table tbody tr:last-child td{border-bottom:none;}
.s2-drug-table th:nth-child(1),.s2-drug-table td:nth-child(1){width:25px;text-align:center;color:var(--color-grey-400);font-family:'Poppins',sans-serif;}
.s2-drug-table th:nth-child(2),.s2-drug-table td:nth-child(2){width:auto;}
.s2-drug-table th:nth-child(3),.s2-drug-table td:nth-child(3){width:64px;text-align:center;}
.s2-drug-table th:last-child,.s2-drug-table td:last-child{text-align:center;width:60px;}
.s2-drug-table th.th-action{width:60px;}
.s2-drug-table td.td-action{text-align:center;padding:6px 4px;display:flex;align-items:center;justify-content:center;gap:2px;}
.s2-drug-name{font-size:14px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-800);}
.s2-drug-sub{font-size:12px;font-weight:500;letter-spacing:-0.26px;color:var(--color-grey-600);margin-top:1px;}
.s2-changed-badge{display:inline-block;background:var(--color-blue-200);color:var(--color-primary);font-size:12px;font-weight:500;letter-spacing:-0.26px;padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle;}
.s2-row-edit-btn{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--color-grey-400);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;}
.s2-row-edit-btn:hover{background:var(--color-grey-150);color:var(--color-grey-600);}
.s2-row-del-btn{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--color-grey-400);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;}
.s2-row-del-btn:hover{background:#FFF4F5;color:var(--color-red);}
.s2-add-drug-row{display:flex;align-items:center;justify-content:center;padding:10px 12px;border-top:1px dashed var(--color-grey-200);}
.s2-add-drug-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border:1.5px dashed var(--color-primary);border-radius:8px;background:var(--color-blue-100);color:var(--color-primary);font-size:14px;font-weight:500;letter-spacing:-0.6px;cursor:pointer;font-family:inherit;}
.s2-add-drug-btn:hover{background:var(--color-blue-200);}
.s2-edit-row td{background:var(--color-blue-100);padding:10px 12px;}
.s2-add-form-row td{background:var(--color-blue-100);padding:10px 12px;}
.s2-edit-form{display:flex;flex-direction:column;gap:14px;padding:12px 14px;}
.s2-edit-label{font-size:11px;font-weight:500;letter-spacing:-0.44px;color:var(--color-grey-550);margin-bottom:8px;display:block;}
.s2-edit-search{position:relative;}
.s2-edit-search input{width:100%;height:38px;border:1px solid var(--color-grey-300);border-radius:5px;padding:0 34px 0 12px;font-size:14px;font-family:inherit;outline:none;}
.s2-edit-search input:focus{border-color:var(--color-primary);}
.s2-edit-search .clear-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--color-grey-400);display:flex;padding:0;}
.s2-edit-qty-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;}
.s2-edit-qty-group{display:flex;flex-direction:column;gap:6px;}
.s2-edit-qty-value{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--color-grey-800);font-family:inherit;}
.s2-edit-qty-input{width:56px;height:26px;border:1px solid #CBCDD0;border-radius:5px;font-family:'Poppins',sans-serif;font-size:14px;color:var(--color-grey-800);text-align:center;outline:none;}
.s2-edit-qty-input:focus{border-color:var(--color-primary);}
.s2-edit-actions{display:flex;gap:8px;justify-content:flex-end;}
.s2-edit-save{height:32px;width:72px;background:var(--color-primary);border:none;border-radius:6px;font-size:13px;font-weight:500;color:var(--color-white);cursor:pointer;font-family:inherit;}
.s2-edit-cancel{height:32px;width:72px;background:var(--color-white);border:1px solid var(--color-primary);border-radius:6px;font-size:13px;font-weight:500;color:var(--color-primary);cursor:pointer;font-family:inherit;}
/* 대체조제 확인 패널 */
.s2-consent-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px 14px;margin-top:8px;background:rgba(238,73,81,.1);border-radius:8px;}
.s2-consent-left{display:flex;align-items:center;gap:8px;}
.s2-consent-icon{width:20px;height:20px;border-radius:50%;background:var(--color-red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.s2-consent-icon span{font-size:13px;font-weight:900;color:var(--color-white);line-height:1;}
.s2-consent-title{font-size:14px;font-weight:500;letter-spacing:-0.6px;color:var(--color-red);}
.s2-consent-sub{font-size:12px;font-weight:400;letter-spacing:-0.48px;color:var(--color-red);margin-top:4px;}
.s2-consent-radios{display:flex;align-items:center;gap:14px;flex-shrink:0;}
.s2-consent-radio{display:flex;align-items:center;gap:5px;font-size:14px;font-weight:400;letter-spacing:-0.6px;color:var(--color-grey-600);cursor:pointer;}
.s2-consent-radio input[type="radio"]{width:14px;height:14px;accent-color:var(--color-primary);cursor:pointer;}
/* 다제약물관리사업 대상자 배너 (v2 s2-poly-alert 그대로 포팅) */
.s2-poly-alert{display:flex;align-items:center;gap:8px;padding:12px 16px;background:rgba(238,73,81,.1);border-radius:8px;margin-bottom:16px;}
.s2-poly-alert-icon{width:20px;height:20px;border-radius:50%;background:var(--color-red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.s2-poly-alert-icon span{font-size:13px;font-weight:900;color:var(--color-white);line-height:1;}
.s2-poly-alert-txt{font-size:15px;font-weight:500;letter-spacing:-0.6px;color:var(--color-red);}

/* 대기/진행 문구 화면 (녹음 중) */
.wait-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;text-align:center;padding:20px;}
.rec-hint{background:var(--color-blue-100);border:1px solid var(--color-blue-200);border-radius:8px;padding:12px 16px;font-size:14.5px;font-weight:500;color:var(--color-primary);max-width:380px;line-height:1.6;text-align:left;}
.rec-hint b{font-weight:700;}

/* 복약지도문 작성 (v2 msg-* 패턴) */
.msg-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.msg-ttl{font-size:20px;font-weight:500;letter-spacing:-0.72px;color:var(--color-grey-700);}
.ai-caption{font-size:13.5px;color:var(--color-grey-500);margin-bottom:10px;}
.msg-ta{width:100%;height:240px;border:1.5px solid var(--color-grey-300);border-radius:10px;padding:14px;font-size:16px;font-weight:400;line-height:27px;letter-spacing:-0.6px;color:var(--color-grey-800);resize:none;font-family:inherit;transition:border-color .15s;}
.msg-ta:focus{outline:none;border-color:var(--color-primary);}
.msg-reset{display:inline-flex;align-items:center;gap:5px;font-size:15px;font-weight:400;letter-spacing:-0.56px;color:var(--color-grey-600);cursor:pointer;background:none;border:none;font-family:inherit;}
.msg-reset:hover{color:var(--color-primary);}
.msg-cnt{text-align:right;font-size:13px;font-weight:400;letter-spacing:-0.48px;margin-top:6px;color:var(--color-grey-500);}

/* 복약 알림 (v2 reminder.css 그대로 포팅) */
.rm-item{width:100%;margin-bottom:16px;}
.rm-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1.5px solid var(--color-grey-250);border-radius:10px;cursor:pointer;transition:border-color .12s,background .12s;user-select:none;width:100%;box-sizing:border-box;}
.rm-row:hover{border-color:#A0B4FF;background:#FAFBFF;}
.rm-row.open{border-color:var(--color-primary);background:var(--color-blue-100);border-bottom-left-radius:0;border-bottom-right-radius:0;}
.rm-row-body{flex:1;min-width:0;overflow:hidden;}
.rm-row-top{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
.rm-row-hospital{font-size:15px;font-weight:700;color:var(--color-grey-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rm-row-right{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.rm-chevron{transition:transform .15s;color:var(--color-grey-500);flex-shrink:0;}

.rm-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.rm-3col{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:16px;align-items:start;}
.rm-date-input,.rm-days-input{border:1.5px solid var(--color-grey-300);border-radius:8px;font-size:14px;font-family:inherit;outline:none;}

.rm-switch .rm-slider::before{content:'';position:absolute;width:15px;height:15px;left:3px;top:3px;background:var(--color-white);border-radius:50%;transition:.15s;}

.puzzle-panel{width:360px;height:723px;max-height:90vh;flex-shrink:0;background:var(--color-white);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--color-grey-200);}

.pz-sub{font-size:14px;color:var(--color-grey-500);margin-top:4px;}

.wait-title{font-size:18px;font-weight:600;color:var(--color-grey-800);}
.rec-wave-row{display:flex;align-items:center;justify-content:center;gap:6px;height:60px;}
.rec-wave-row span{width:6px;border-radius:3px;background:var(--color-primary);animation:pzWave 1.1s ease-in-out infinite;}
.rec-wave-row span:nth-child(1){height:18px;animation-delay:0s;}
.rec-wave-row span:nth-child(2){height:36px;animation-delay:.15s;}
.rec-wave-row span:nth-child(3){height:52px;animation-delay:.3s;}
.rec-wave-row span:nth-child(4){height:32px;animation-delay:.45s;}
.rec-wave-row span:nth-child(5){height:20px;animation-delay:.6s;}
.rec-wave-row.done span{animation-play-state:paused;opacity:.4;}
.rec-wave-row.compact{gap:3px;height:20px;}
.rec-wave-row.compact span{width:3px;}
.rec-wave-row.compact span:nth-child(1){height:7px;}
.rec-wave-row.compact span:nth-child(2){height:13px;}

.rec-wave-row.compact span:nth-child(5){height:8px;}

function getChosung(str){
  var out = '';
  for(var i=0;i<str.length;i++){
    var code = str.charCodeAt(i) - 0xAC00;
    if(code > -1 && code < 11172){
      out += CHOSUNG_LIST[Math.floor(code / 588)];
    } else {
      out += str[i];
    }
  }
  return out;
}
function isChosungQuery(q){
  return q.length > 0 && q.split('').every(function(ch){ return CHOSUNG_LIST.indexOf(ch) > -1; });

var reminderSettings = {};
function parseFreqCount(freq){
  var m = /([0-9]+)\s*회/.exec(freq || '');
  return m ? parseInt(m[1], 10) : 1;
}
function defaultSlotsForTimes(n){
  if(n <= 1) return ['아침'];
  if(n === 2) return ['아침', '점심'];
  if(n === 3) return ['아침', '점심', '저녁'];
  return ['아침', '점심', '저녁', '취침전'];
}
function todayISODate(){

}
function initReminderSettingsFor(rx){
  if(reminderSettings[rx.id]) return;
  var drugs = editingDrugsMap[rx.id] || rx.drugs;
  var times = Math.min(4, Math.max.apply(null, drugs.map(function(d){ return parseFreqCount(d.freq); })));
  reminderSettings[rx.id] = {
    enabled: true,
    times: times,
    slots: new Set(defaultSlotsForTimes(times)),
    timing: '식후 30분',
    startDate: todayISODate(),
    days: Math.max.apply(null, drugs.map(function(d){ return d.days || 7; })),
    uiOpen: false
  };

function rmToggleExpand(id){
  reminderSettings[id].uiOpen = !reminderSettings[id].uiOpen;
  renderReminderCardWrap();
}
function rmToggleEnabled(id){
  reminderSettings[id].enabled = !reminderSettings[id].enabled;
  renderReminderCardWrap();
  refreshDraftIfUntouched();
}
function rmSetTimes(id, n){
  var s = reminderSettings[id];
  s.times = n;
  s.slots = new Set(defaultSlotsForTimes(n));
  renderReminderCardWrap();
  refreshDraftIfUntouched();
}
function rmToggleSlot(id, slot){
  var s = reminderSettings[id];
  var errEl = document.getElementById('rmSlotError_' + id);
  if(s.slots.has(slot)){
    s.slots.delete(slot);
  } else {
    if(s.slots.size >= s.times){
      if(errEl) errEl.style.display = 'inline';
      return;
    }
    s.slots.add(slot);
  }
  if(errEl) errEl.style.display = 'none';
  renderReminderCardWrap();
  refreshDraftIfUntouched();
}
function rmSetTiming(id, val){
  reminderSettings[id].timing = val;
  renderReminderCardWrap();
  refreshDraftIfUntouched();
}
function rmSetStartDate(id, val){
  reminderSettings[id].startDate = val;

function rmChangeDays(id, delta){
  var s = reminderSettings[id];
  s.days = Math.max(1, (s.days || 1) + delta);

}
function rmSetDays(id, val){
  var s = reminderSettings[id];

}

  document.getElementById('pzName').textContent = '고객 선택 대기 중';
  var pzBodyReset = document.getElementById('pzBody');
  pzBodyReset.style.alignItems = '';
  pzBodyReset.style.justifyContent = '';
  pzBodyReset.innerHTML = '<div class="pz-idle">아직 녹음이 시작되지 않았습니다. 왼쪽에서 고객을 먼저 확인해 주세요.</div>';
  document.getElementById('pzFooter').innerHTML = '';
  document.getElementById('st1').innerHTML = '<span class="step-num">1</span> 복약 상담';
  document.getElementById('st2').innerHTML = '<span class="step-num">2</span> 복약지도문 작성';
  var st3reset = document.getElementById('st3');
  st3reset.style.display = '';
  st3reset.innerHTML = '<span class="step-num">3</span> 메시지 확인';
  renderSearch();
}

/* ── 고객 검색 ── */
function renderSearch(){
  setStep(1);
  document.getElementById('stepTabs').style.display = 'none';
  var B = document.getElementById('mbody');
  var F = document.getElementById('mfoot');
  B.innerHTML =
    '<div class="field-col">' +
      '<div class="field">' +
        '<!-- component: search/default -->' +
        '<div class="s1-search-wrap">' +
          '<input id="s1input" data-figma="search/default" type="text" placeholder="이름, 초성(ㄱㅁㅇ), 전화번호, 생년월일" oninput="onSearch(this.value)" autocomplete="off">' +
          '<span class="s1-search-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>' +
        '</div>' +
      '</div>' +
      '<div id="searchResults"></div>' +
      '<div class="s1-divider">또는</div>' +
      '<!-- component: button/outlined-secondary -->' +
      '<button class="s1-new-btn" data-figma="button/outlined-secondary" onclick="startAsNew()">나중에 입력하기</button>' +
    '</div>';
  F.innerHTML = '';
}
function onSearch(q){
  q = q.trim();
  var box = document.getElementById('searchResults');
  if(!q){ box.innerHTML=''; currentMatches = []; return; }
  var qDigits = q.replace(/-/g,'');
  var qIsChosung = isChosungQuery(q);
  currentMatches = PATIENTS.filter(function(p){
    if(p.name.indexOf(q) > -1) return true;
    if(p.phone.replace(/-/g,'').indexOf(qDigits) > -1) return true;
    if(p.birth.replace(/-/g,'').indexOf(qDigits) > -1) return true;
    if(qIsChosung && getChosung(p.name).indexOf(q) > -1) return true;
    return false;
  });
  box.innerHTML = currentMatches.length
    ? '<div class="s1-results">' + currentMatches.map(function(p,i){
        return '<!-- component: new/patient-search-result --><div class="s1-result-item" data-figma="new/patient-search-result" onclick="confirmPatient('+i+')">' +
          '<div class="s1-result-avatar">'+p.name[0]+'</div>' +
          '<div><div class="s1-result-name">'+p.name+'</div><div class="s1-result-phone">'+p.phone+' · '+p.birth+'</div></div>' +
        '</div>';
      }).join('') + '</div>'
    : '<div class="s1-empty">일치하는 고객이 없습니다. 나중에 입력하기로 진행해 주세요.</div>';
}
function confirmPatient(i){
  selectedPatient = Object.assign({}, currentMatches[i], {isNew:false});
  showRxSelectionStep();
}
function startAsNew(){
  selectedPatient = {name:generateNickname(), phone:null, isNew:true};
  beginRecording();
}

/* ── Step1 "처방전 선택" — 단골 고객 전용, 녹음 시작 전에 참고할 처방전을 먼저 고르는 화면 ── */
function showRxSelectionStep(){
  setStep(1);
  document.getElementById('stepTabs').style.display = '';
  renderModalPtBar(false);
  document.getElementById('st1').innerHTML = '<span class="step-num">1</span> 처방전 선택';
  document.getElementById('st2').innerHTML = '<span class="step-num">2</span> 상담 진행';
  document.getElementById('st3').style.display = '';
  document.getElementById('st3').innerHTML = '<span class="step-num">3</span> 복약지도문 작성';

  var rx = getDefaultActiveRx(selectedPatient);
  if(rx) currentRxId = rx.id;
  var rxHist = selectedPatient.rxHistory || [];
  expandedRxId = rxHist.length === 1 ? rxHist[0].id : null;

  var histHtml = rxHist.length
    ? '<!-- component: new/rx-history-panel --><div class="rx-history-panel" id="rxHistoryPanel" data-figma="new/rx-history-panel">' +
        '<div class="rx-history-list" id="rxHistoryList"></div>' +
      '</div>'
    : '<div class="rx-empty-state">' +
        '<div class="rx-empty-icon">📋</div>' +
        '<div class="rx-empty-title">조제 가능한 처방전이 없습니다</div>' +
        '<div class="rx-empty-sub">처방전을 선택하지 않아도 복약 상담을 진행할 수 있습니다.</div>' +
      '</div>';

  document.getElementById('mbody').innerHTML = renderPolyAlertHtml(selectedPatient) + histHtml;
  document.getElementById('mfoot').innerHTML =
    '<!-- component: button/solid --><button class="btn-next" data-figma="button/solid" onclick="beginRecording()">상담 시작</button>';

  if(rxHist.length){
    renderRxHistoryPanel();
  }
}

/* ── 고객 정보 바 (v2 modal-pt 패턴: 아바타 + 이름(+수정, 신규만) + 정보 + 삭제(녹음 전까지)) ── */
function renderModalPtBar(showRemove){
  ptShowRemove = showRemove;
  var pt = document.getElementById('modalPt');
  var removeBtn = showRemove ? '<button class="modal-pt-remove" onclick="removePatient()" title="선택 취소">'+REMOVE_ICON+'</button>' : '';
  if(selectedPatient.name){
    var editBtn = selectedPatient.isNew ? '<button class="modal-pt-name-edit" onclick="startEditName()" title="이름 수정">'+EDIT_ICON+'</button>' : '';
    var info = selectedPatient.isNew ? '' : '<span class="modal-pt-info">'+selectedPatient.phone+'</span>';
    pt.innerHTML =
      '<div class="modal-pt-avatar">'+selectedPatient.name[0]+'</div>' +
      '<div><span class="modal-pt-name">'+selectedPatient.name+'</span>'+editBtn+info+'</div>' + removeBtn;
  } else {
    pt.innerHTML =
      '<div class="modal-pt-avatar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#8B95A1" stroke-width="1.8"/><path d="M4 20c0-4 3.5-7 8-7s8 3 8 7" stroke="#8B95A1" stroke-width="1.8" stroke-linecap="round"/></svg></div>' +
      '<div><span class="modal-pt-name">신규 고객</span>' +
      '<button class="modal-pt-name-edit" onclick="startEditName()" title="이름 입력">'+EDIT_ICON+'</button></div>' + removeBtn;
  }
}
function startEditName(){
  var pt = document.getElementById('modalPt');
  pt.innerHTML =
    '<input id="ptNameInput" class="modal-pt-name-input" value="'+(selectedPatient.name||'')+'" placeholder="이름 입력" onkeydown="if(event.key===\'Enter\')commitEditName()">' +
    '<button class="modal-pt-name-edit" onclick="commitEditName()" title="확인"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 6" stroke="currentColor" stroke-width="2"/></svg></button>';
  document.getElementById('ptNameInput').focus();
}
function commitEditName(){
  var v = document.getElementById('ptNameInput').value.trim();
  selectedPatient.name = v || null;
  renderModalPtBar(ptShowRemove);
  document.getElementById('pzName').textContent = selectedPatient.name || '신규 고객';
}
function removePatient(){
  resetFlow();
}

/* ── 처방전 이력 패널: 행별 펼치기(편집 가능한 약품 테이블)/처방전 원본 보기 ── */
var expandedRxId = null;
function getCurrentRx(){
  return (selectedPatient.rxHistory || []).find(function(r){ return r.id === currentRxId; });
}
function getDefaultActiveRx(patient){
  var hist = patient.rxHistory || [];
  for(var i = 0; i < hist.length; i++){
    if(!hist[i].guidanceSent) return hist[i];
  }
  return hist[0] || null;
}
/* 다제약물관리사업 대상자 배너 — 약사가 처방전을 따로 선택하지 않아도 최근 6개월 처방 이력을 시스템이 자동 계산해서 노출 (10종 이상 약물을 180일 이상 처방) */
function computePolyQualifyingCount(patient){
  var hist = patient.rxHistory || [];
  var cutoff = new Date(todayISODate());
  cutoff.setMonth(cutoff.getMonth() - 6);
  var count = 0;
  hist.forEach(function(rx){
    if(new Date(rx.date) < cutoff) return;
    rx.drugs.forEach(function(d){ if(d.days >= 180) count++; });
  });
  return count;
}
function renderPolyAlertHtml(patient){
  if(computePolyQualifyingCount(patient) < 10) return '';
  return '<div class="s2-poly-alert">' +
    '<div class="s2-poly-alert-icon"><span>!</span></div>' +
    '<span class="s2-poly-alert-txt">다제약물관리사업 대상자 확인이 필요합니다(10종 이상의 약물을 6개월 이상 지속 복용)</span>' +
  '</div>';
}
function ensureEditingDrugs(rx){
  if(!editingDrugsMap[rx.id]) editingDrugsMap[rx.id] = rx.drugs.map(function(d){ return Object.assign({}, d); });
  return editingDrugsMap[rx.id];
}
function toggleRxHistoryItem(id){
  expandedRxId = (expandedRxId === id) ? null : id;
  renderRxHistoryPanel();
}
/* 처방전이 여러 건일 때만 노출되는 선택 체크박스 — 상담에 참고할 처방전을 고르는 용도(선택 안 해도 상담 가능) */
function selectRxHistoryItem(id){
  currentRxId = (currentRxId === id) ? null : id;
  renderRxHistoryPanel();
}
function renderRxHistoryPanel(){
  var panel = document.getElementById('rxHistoryPanel');
  if(!panel) return;
  var hist = selectedPatient.rxHistory || [];
  var listEl = document.getElementById('rxHistoryList');
  listEl.innerHTML = hist.length
    ? hist.map(function(rx){
        var isOpen = hist.length === 1 ? true : rx.id === expandedRxId;
        var expandHtml = isOpen ? renderDrugTableHTML(rx) : '';
        var checkboxHtml = '<input type="checkbox" class="rx-history-check" onclick="event.stopPropagation()" onchange="selectRxHistoryItem(\'' + rx.id + '\')"' + (rx.id === currentRxId ? ' checked' : '') + '>';
        return '<div class="rx-history-item' + (rx.id === currentRxId ? ' active' : '') + (isOpen ? ' open' : '') + '">' +
          '<div class="rx-history-row">' +
            '<div class="rx-history-main" onclick="toggleRxHistoryItem(\'' + rx.id + '\')">' +
              checkboxHtml +
              '<span class="rx-history-hospital">' + rx.hospital + '</span>' +
              '<span class="rx-history-day">' + rx.date + '</span>' +
            '</div>' +
            '<div class="rx-history-actions">' +
              '<button type="button" class="rx-history-action-btn" onclick="event.stopPropagation();openRxViewer(\'' + rx.date + ' ' + rx.hospital + '\')">처방전 원본</button>' +
              '<button type="button" class="rx-history-toggle-btn" onclick="toggleRxHistoryItem(\'' + rx.id + '\')">▾</button>' +
            '</div>' +
          '</div>' +
          '<div class="rx-history-item-expand">' + expandHtml + '</div>' +
        '</div>';
      }).join('')
    : '';
}
function refreshExpandedRxItem(){
  if(!expandedRxId) return;
  var rx = getCurrentRx();
  if(!rx) return;
  renderRxHistoryPanel();
}

/* ── 약품 테이블 렌더링 + 편집/추가/삭제 + 대체조제 확인 (v2 modal_send_v2.html 로직 그대로 포팅) ── */
function renderDrugTableHTML(rx){
  var drugs = ensureEditingDrugs(rx);
  var origDrugs = rx.drugs;
  var hasSub = drugs.some(function(d){ return d.sub; });
  var rows = drugs.map(function(d, i){
    var changed = JSON.stringify(d) !== JSON.stringify(origDrugs[i]);
    var isNew = i >= origDrugs.length;
    var badge = (changed || isNew) ? '<span class="s2-changed-badge">' + (isNew ? '추가' : '변경') + '</span>' : '';
    var usageLine = '1회 ' + d.dosage + ', ' + d.freq.replace('1일', '하루');
    return '<tr id="drow_' + rx.id + '_' + i + '">' +
      '<td>' + (i + 1) + '</td>' +
      '<td><div class="s2-drug-name">' + d.name + badge + '</div><div class="s2-drug-sub">' + usageLine + '</div></td>' +
      '<td>' + d.days + '일분</td>' +
      '<td class="td-action">' +
        '<button class="s2-row-edit-btn" onclick="openEditRow(\'' + rx.id + '\',' + i + ')" title="편집">' + EDIT_ICON + '</button>' +
        '<button class="s2-row-del-btn" onclick="deleteDrug(\'' + rx.id + '\',' + i + ')" title="삭제">' + REMOVE_ICON + '</button>' +
      '</td>' +
    '</tr>';
  }).join('');
  var consentBlock = hasSub
    ? '<div class="s2-consent-row">' +
        '<div class="s2-consent-left">' +
          '<div class="s2-consent-icon"><span>!</span></div>' +
          '<div><div class="s2-consent-title">대체 조제인가요?</div><div class="s2-consent-sub">고객에게 대체조제 사실을 알려야 합니다.</div></div>' +
        '</div>' +
        '<div class="s2-consent-radios">' +
          '<label class="s2-consent-radio"><input type="radio" name="subConsent_' + rx.id + '" value="yes"> 네</label>' +
          '<label class="s2-consent-radio"><input type="radio" name="subConsent_' + rx.id + '" value="no"> 아니오</label>' +
        '</div>' +
      '</div>'
    : '';
  return '<div class="s2-rx-box">' +
    '<table class="s2-drug-table"><thead><tr><th>NO</th><th>약명</th><th>복용일</th><th class="th-action"></th></tr></thead>' +
    '<tbody id="drugTbody_' + rx.id + '">' + rows + '</tbody></table>' +
    '<div class="s2-add-drug-row"><button class="s2-add-drug-btn" onclick="openAddRow(\'' + rx.id + '\')">' + ADD_ICON + ' 약품 추가</button></div>' +
    consentBlock +
  '</div>';
}
function parseLeadingQty(str){
  var m = /^(\d+)\s*(.*)$/.exec((str || '').trim());
  return m ? { num: m[1], unit: m[2] || '정' } : { num: '1', unit: str || '정' };
}
function parseLeadingFreq(str){
  var m = /([0-9]+)\s*회/.exec(str || '');
  return m ? m[1] : '1';
}
function qtyFieldsHTML(prefix, dosage, freq, days){
  var d = parseLeadingQty(dosage);
  var freqNum = parseLeadingFreq(freq);
  return '<div class="s2-edit-qty-row">' +
    '<div class="s2-edit-qty-group"><label class="s2-edit-label">용량</label><div class="s2-edit-qty-value">1회 <input class="s2-edit-qty-input" id="' + prefix + '_dnum" type="number" min="1" value="' + d.num + '"> ' + d.unit + '</div></div>' +
    '<div class="s2-edit-qty-group"><label class="s2-edit-label">횟수</label><div class="s2-edit-qty-value">하루 <input class="s2-edit-qty-input" id="' + prefix + '_fnum" type="number" min="1" value="' + freqNum + '"> 회</div></div>' +
    '<div class="s2-edit-qty-group"><label class="s2-edit-label">일수</label><div class="s2-edit-qty-value"><input class="s2-edit-qty-input" id="' + prefix + '_days" type="number" min="1" value="' + days + '"> 일</div></div>' +
  '</div>';
}
function openEditRow(rxId, i){
  var key = rxId + '_' + i;
  var existing = document.getElementById('editForm_' + key);
  if(existing){ closeEditRow(key); return; }
  document.querySelectorAll('[id^="editForm_"]').forEach(function(el){ el.remove(); });
  var d = editingDrugsMap[rxId][i];
  var row = document.getElementById('drow_' + key);
  var formRow = document.createElement('tr');
  formRow.id = 'editForm_' + key;
  formRow.className = 's2-edit-row';
  formRow.innerHTML = '<td colspan="4"><div class="s2-edit-form">' +
    '<div><label class="s2-edit-label">약품 검색</label><div class="s2-edit-search">' +
      '<input id="ef_name_' + key + '" value="' + d.name + '">' +
      '<button class="clear-btn" onclick="document.getElementById(\'ef_name_' + key + '\').value=\'\'">' + CLEAR_ICON + '</button>' +
    '</div></div>' +
    qtyFieldsHTML('ef_' + key, d.dosage, d.freq, d.days) +
    '<div class="s2-edit-actions">' +
      '<button class="s2-edit-cancel" onclick="document.getElementById(\'editForm_' + key + '\').remove()">취소</button>' +
      '<button class="s2-edit-save" onclick="saveEditRow(\'' + rxId + '\',' + i + ')">저장</button>' +
    '</div>' +
  '</div></td>';
  row.after(formRow);
  document.getElementById('ef_name_' + key).focus();
}
function closeEditRow(key){
  var el = document.getElementById('editForm_' + key);
  if(el) el.remove();
}
function saveEditRow(rxId, i){
  var key = rxId + '_' + i;
  var prev = editingDrugsMap[rxId][i];
  var p = 'ef_' + key;
  var dNum = document.getElementById(p + '_dnum').value.trim();
  var dUnit = parseLeadingQty(prev.dosage).unit;
  var fNum = document.getElementById(p + '_fnum').value.trim();
  var days = parseInt(document.getElementById(p + '_days').value) || prev.days;
  editingDrugsMap[rxId][i] = {
    name: document.getElementById('ef_name_' + key).value.trim() || prev.name,
    dosage: (dNum || '1') + dUnit,
    freq: '1일 ' + (fNum || '1') + '회',
    days: days,
    sub: prev.sub
  };
  refreshExpandedRxItem();
}
function deleteDrug(rxId, i){
  if(!confirm('"' + editingDrugsMap[rxId][i].name + '" 을(를) 목록에서 삭제할까요?')) return;
  editingDrugsMap[rxId].splice(i, 1);
  refreshExpandedRxItem();
}
function openAddRow(rxId){
  var formId = 'addFormRow_' + rxId;
  if(document.getElementById(formId)) return;
  document.querySelectorAll('[id^="editForm_"]').forEach(function(el){ el.remove(); });
  var addRow = document.createElement('tr');
  addRow.id = formId;
  addRow.className = 's2-add-form-row';
  addRow.innerHTML = '<td colspan="4"><div class="s2-edit-form">' +
    '<div><label class="s2-edit-label">약품 검색</label><div class="s2-edit-search">' +
      '<input id="af_name_' + rxId + '" placeholder="약품명을 검색하세요.">' +
      '<button class="clear-btn" onclick="document.getElementById(\'af_name_' + rxId + '\').value=\'\'">' + CLEAR_ICON + '</button>' +
    '</div></div>' +
    qtyFieldsHTML('af_' + rxId, '1정', '1일 1회', 30) +
    '<div class="s2-edit-actions">' +
      '<button class="s2-edit-cancel" onclick="document.getElementById(\'' + formId + '\').remove()">취소</button>' +
      '<button class="s2-edit-save" onclick="saveAddRow(\'' + rxId + '\')">저장</button>' +
    '</div>' +
  '</div></td>';
  var table = document.getElementById('drugTbody_' + rxId).closest('table');
  var addBtnRow = table.nextElementSibling;
  addBtnRow.before(addRow);
  document.getElementById('af_name_' + rxId).focus();
}
function saveAddRow(rxId){
  var name = document.getElementById('af_name_' + rxId).value.trim();
  var p = 'af_' + rxId;
  var dNum = document.getElementById(p + '_dnum').value.trim() || '1';
  var fNum = document.getElementById(p + '_fnum').value.trim() || '1';
  var days = parseInt(document.getElementById(p + '_days').value) || 30;
  if(!name){ alert('약품명을 입력해 주세요.'); return; }
  editingDrugsMap[rxId].push({ name: name, dosage: dNum + '정', freq: '1일 ' + fNum + '회', days: days, sub: false });
  refreshExpandedRxItem();
}

/* ── 고객 선택 즉시 녹음 시작 (검색/신규 선택 → 바로 녹음) ── */
function beginRecording(){
  document.getElementById('stepTabs').style.display = '';
  renderModalPtBar(false);
  var st3 = document.getElementById('st3');
  if(selectedPatient.isNew){
    setStep(1);
    document.getElementById('st1').innerHTML = '<span class="step-num">1</span> 복약 상담';
    st3.style.display = '';
    st3.innerHTML = '<span class="step-num">3</span> 전화번호 입력';
  } else {
    setStep(2);
  }
  document.getElementById('mbody').innerHTML =
    '<div class="wait-stage">' +
      '<div class="wait-title">상담이 진행 중입니다</div>' +
      '<div class="rec-wave-row" id="recCircle"><span></span><span></span><span></span><span></span><span></span></div>' +
      '<div class="rec-timer" id="recTimer">00:00</div>' +
      '<div class="rec-label" id="recLabel"></div>' +
      '<div class="rec-hint">👉 상담이 끝나면 오른쪽 <b>AI 패널</b>의 <b>"상담 종료"</b> 버튼을 눌러 주세요. AI가 복약 상담 내용을 생성합니다.</div>' +
    '</div>';
  document.getElementById('mfoot').innerHTML = '';

  document.getElementById('pzSub').textContent = '녹음이 시작되었습니다';
  document.getElementById('pzName').textContent = selectedPatient.name || '신규 고객';
  var pzBody = document.getElementById('pzBody');
  pzBody.style.alignItems = 'stretch';
  pzBody.style.justifyContent = 'flex-start';
  pzBody.innerHTML = '<div class="pz-stt-box" id="sttBox"></div>';
  startStt();
  document.getElementById('pzFooter').innerHTML =
    '<!-- component: button/solid --><button class="btn-stop" data-figma="button/solid" id="btnStop" onclick="endRecording()">' +
      '<svg width="13" height="13" viewBox="0 0 24 24" fill="#FFFFFF"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>' +
      '상담 종료</button>';
  seconds = 0;
  clearInterval(timerId);
  timerId = setInterval(function(){
    seconds++;
    var m = String(Math.floor(seconds/60)).padStart(2,'0');
    var s = String(seconds%60).padStart(2,'0');
    document.getElementById('recTimer').textContent = m + ':' + s;
  }, 1000);
}

function endRecording(){
  clearInterval(timerId);
  clearInterval(sttTimer);
  var cursor = document.querySelector('.pz-stt-cursor');
  if(cursor) cursor.remove();
  document.getElementById('btnStop').disabled = true;
  document.getElementById('recCircle').classList.add('done');
  document.getElementById('recLabel').textContent = '녹음 종료';
  document.getElementById('pzSub').textContent = '상담 내용을 요약했습니다';
  goSummary();
}
function goSummary(){
  setStep(selectedPatient.isNew ? 2 : 3);
  var isKnown = selectedPatient.phone && !selectedPatient.isNew;
  var activeRx = selectedPatient.isNew ? null : getCurrentRx();
  if(activeRx) initReminderSettingsFor(activeRx);
  var draft = currentDraft !== null ? currentDraft : buildAiDraft();
  var taBlock =
    '<!-- component: new/message-draft --><textarea class="msg-ta" id="draftText" data-figma="new/message-draft" oninput="updateMsgCount()">' + draft + '</textarea>' +
    '<div class="msg-cnt" id="msgCnt"></div>';
  var bodyContent;
  if(isKnown && activeRx){
    bodyContent = '<div id="reminderCardWrap"></div>' + taBlock;
  } else {
    bodyContent = taBlock;
  }
  document.getElementById('mbody').innerHTML =
    '<div class="msg-hdr"><span class="msg-ttl">복약지도문 작성</span>' +
      '<!-- component: button/ghost --><button class="msg-reset" data-figma="button/ghost" onclick="resetDraft()">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 1 2.34 5.66M4 12v5M4 12H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>다시 생성</button>' +
    '</div>' +
    '<div class="ai-caption">AI가 요약한 초안입니다 — 자유롭게 수정하세요.</div>' +
    bodyContent;
  if(isKnown && activeRx) renderReminderCardWrap();
  updateMsgCount();
  document.getElementById('mfoot').innerHTML = isKnown
    ? '<!-- component: button/solid --><button class="btn-next send" data-figma="button/solid" onclick="sendKnownDirect()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>앱으로 보내기</button>'
    : '<!-- component: button/solid --><button class="btn-next" data-figma="button/solid" onclick="goSend()">다음</button>';
}
function updateMsgCount(){
  var len = document.getElementById('draftText').value.length;
  document.getElementById('msgCnt').textContent = len + '자';
}
function resetDraft(){
  currentDraft = null;
  document.getElementById('draftText').value = buildAiDraft();
  updateMsgCount();
}
function sendKnownDirect(){
  currentDraft = document.getElementById('draftText').value;
  renderComplete(selectedPatient.name+'님의 웰체크 앱으로 복약지도문이 발송되었습니다.');
}

/* ── 전화번호 입력 — 신규 고객 전용(단골은 goSummary에서 바로 발송) ── */
var PHARMACY_PHONE = '02-1234-5678';
function goSend(){
  setStep(3);
  currentDraft = document.getElementById('draftText').value;
  var rightCol =
    '<!-- component: new/send-summary-table --><table class="sum-tbl" data-figma="new/send-summary-table">' +
      '<tr><td>발송 채널</td><td>문자(SMS)</td></tr>' +
      '<tr><td>약국 번호</td><td>'+PHARMACY_PHONE+'</td></tr>' +
    '</table>' +
    '<div class="field"><label>고객 연락처 <span class="req">(필수)</span></label>' +
      '<!-- component: new/phone-input-big --><input id="sendPhone" class="phone-input-big" data-figma="new/phone-input-big" type="tel" inputmode="numeric" placeholder="010-0000-0000" maxlength="13" oninput="formatPhoneInput(this);checkSendEnabled();">' +
      '</div>' +
    '<!-- component: new/consent-checkbox --><label class="consent-row" data-figma="new/consent-checkbox">' +
      '<input type="checkbox" id="smsConsent" onchange="checkSendEnabled()"> 본인은 초대장 문자 발송 대상자(환자 등)의 동의를 받았거나, 해당 정보 제공이 가능한 정당한 권한이 있음을 확인합니다.' +
    '</label>';
  document.getElementById('mbody').innerHTML = '<div class="send-summary-label">전화번호 입력</div>' + rightCol;
  document.getElementById('mfoot').innerHTML =
    '<button class="btn-back" onclick="goSummary()">이전</button>' +
    '<!-- component: button/solid --><button class="btn-next send" id="btnSend" data-figma="button/solid" disabled onclick="doSend()">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>문자로 보내기</button>';
  document.getElementById('sendPhone').focus();
}
function formatPhoneInput(el){
  var d = el.value.replace(/\D/g,'').slice(0,11);
  var out = d;
  if(d.length > 3 && d.length <= 7) out = d.slice(0,3) + '-' + d.slice(3);
  else if(d.length > 7) out = d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
  el.value = out;
}
function checkSendEnabled(){
  var phone = document.getElementById('sendPhone').value.replace(/\D/g,'');
  var consented = document.getElementById('smsConsent').checked;
  document.getElementById('btnSend').disabled = phone.length !== 11 || !consented;
}
function doSend(){
  selectedPatient.phone = document.getElementById('sendPhone').value || selectedPatient.phone;
  renderComplete(selectedPatient.phone+'로 복약지도문과 웰체크 앱 초대 링크가 문자(SMS)로 발송되었습니다.');
}
function renderComplete(cplSub){
  document.getElementById('mbody').innerHTML =
    '<div class="cpl-wrap">' +
      '<div class="cpl-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 6" stroke="#33AF2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '<div class="cpl-ttl">전송이 완료되었습니다</div>' +
      '<div class="cpl-sub">'+cplSub+'</div>' +
    '</div>';
  document.getElementById('mfoot').innerHTML =
    '<button class="btn-close-cpl" onclick="closeModal()">확인</button>';
}

renderSearch();
if(window.parent && window.parent !== window){
  var standaloneFab = document.getElementById('standaloneFab');
  if(standaloneFab) standaloneFab.style.display = 'none';
}
</script>

</body>
</html>
