<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 복약 상담 내역</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#f5f6f8;min-height:100vh;display:flex;color:#09081d;}

/* ── LNB (어드민 확장) ── */
.lnb{width:250px;min-height:100vh;background:#fff;border-right:1px solid #d8d8d8;box-shadow:2px 0 2px rgba(0,0,0,.05);display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;height:100vh;z-index:10;}
.lnb-user{display:flex;align-items:center;gap:10px;height:110px;padding:0 25px;border-bottom:1px solid #d8d8d8;}
.lnb-avatar{width:50px;height:50px;border-radius:50%;background:#e3ebff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#4a6dff;flex-shrink:0;}
.lnb-user-name{font-size:16px;font-weight:700;color:#09081d;}
.lnb-logout{font-size:12px;color:#505968;text-decoration:underline;margin-top:8px;display:inline-block;}
.lnb-nav{padding-top:10px;}
.lnb-item{display:flex;align-items:center;gap:20px;padding:15px 20px 15px 25px;font-size:15px;font-weight:500;color:#505968;text-decoration:none;cursor:pointer;}
.lnb-item.active{background:#f4f7ff;border-left:3px solid #4a6dff;color:#4a6dff;font-weight:700;padding-left:22px;}
.lnb-icon{width:16px;height:16px;flex-shrink:0;}
.lnb-sub{background:#fff;padding:5px 10px 10px;}
.lnb-sub-item{display:block;padding:10px 10px 10px 50px;font-size:14px;font-weight:500;color:#8f96a1;text-decoration:none;border-radius:8px;}
.lnb-sub-item.active{color:#4a6dff;text-decoration:underline;font-weight:500;}

/* ── MAIN ── */
.main{margin-left:250px;flex:1;min-height:100vh;padding:0 30px 100px;}

/* GNB */
.gnb{display:flex;align-items:flex-end;justify-content:space-between;padding:40px 0 20px;}
.gnb-title{font-size:30px;font-weight:700;color:#09081d;letter-spacing:-1.5px;}
.gnb-actions{display:flex;gap:5px;}
.btn-l{display:flex;align-items:center;gap:5px;height:48px;padding:0 30px;border-radius:8px;font-size:18px;font-weight:700;letter-spacing:-.9px;cursor:pointer;background:#fff;font-family:inherit;}
.btn-l.outlined-secondary{border:1px solid #bdc1c7;color:#505968;}
.btn-l.outlined{border:1px solid #4a6dff;color:#4a6dff;}

/* 필터 영역 */
.filters{display:flex;flex-direction:column;gap:20px;margin-bottom:20px;}
.month-nav{display:flex;align-items:center;gap:20px;height:40px;}
.month-nav-btn{width:30px;height:30px;border:none;background:none;cursor:pointer;color:#505968;font-size:16px;display:flex;align-items:center;justify-content:center;}
.month-label{display:flex;align-items:center;gap:5px;font-size:22px;font-weight:500;color:#09081d;letter-spacing:-1.1px;}
.month-icon{width:18px;height:20px;}
.search-wrap{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid #d8d8d8;border-radius:5px;height:40px;padding:10px 12px;width:345px;}
.search-input{border:none;outline:none;flex:1;font-size:14px;font-family:inherit;color:#09081d;}
.search-input::placeholder{color:#bdc1c7;}

/* 목록 카드 */
.card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;box-shadow:0 2px 4px rgba(108,117,125,.1);padding:30px 30px 40px;}
.card-hd{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;}
.card-hd-top{display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:20px;font-weight:500;color:#09081d;letter-spacing:-1px;}
.card-title .count{color:#4a6dff;}
.card-updated{font-size:12px;color:#505968;}
.card-note{font-size:12px;color:#505968;}

/* 지표 구분(정량/정성) 라벨 */

/* 테이블 */
.table-scroll{overflow-x:auto;}
table{width:100%;min-width:1050px;border-collapse:collapse;}
thead th{background:#eeeff1;height:60px;font-size:12px;font-weight:700;color:#505968;letter-spacing:-.6px;padding:0 10px;text-align:center;white-space:nowrap;}
thead th.group-quant{background:#eef4ff;}
thead th.group-qual{background:#fff3e9;}
tbody td{height:50px;border-bottom:1px solid #e8e8e8;font-size:14px;color:#505968;text-align:center;letter-spacing:-.7px;}
tbody td.strong{font-weight:700;}
tbody tr:hover{background:#f8fbff;}

/* 컬럼 헤더 툴팁 */
.th-label{display:inline-flex;align-items:center;gap:4px;white-space:normal;}
.th-tip{display:inline-flex;width:14px;height:14px;border-radius:50%;border:1px solid #a9adb9;color:#8f96a1;font-size:10px;font-weight:700;align-items:center;justify-content:center;cursor:default;flex-shrink:0;}

/* 오름차순/내림차순 정렬 버튼 */
.sort-btn{display:inline-flex;flex-direction:column;justify-content:center;gap:2px;cursor:pointer;flex-shrink:0;}
.sort-btn .tri{font-size:7px;line-height:1;color:#bdc1c7;}
.sort-btn .tri.active{color:#4a6dff;}

/* 전역 툴팁 (JS로 위치 계산 — table-scroll의 overflow-x:auto가 overflow-y까지 잘라버리는 문제 회피용으로 body 기준 fixed 배치) */
.global-tip{display:none;position:fixed;max-width:260px;background:#333d48;color:#fff;font-size:12px;font-weight:400;letter-spacing:-.3px;line-height:1.5;padding:10px 12px;border-radius:8px;text-align:left;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.2);}

/* 단골 전환율 강조 */
.conv-good{color:#00a313;font-weight:700;}
.conv-none{color:#bdc1c7;font-weight:500;}

/* 페이지네이션 */
.pagination{display:flex;align-items:center;justify-content:space-between;padding-top:15px;}
.pg-spacer{width:145px;height:36px;}
.pg-numbers{display:flex;gap:20px;align-items:center;}
.pg-nav-btn{width:30px;height:30px;border:none;background:none;cursor:pointer;color:#505968;font-size:16px;display:flex;align-items:center;justify-content:center;}
.pg-list{display:flex;gap:5px;font-size:16px;letter-spacing:-.8px;}
.pg-list span{width:20px;text-align:center;color:#bdc1c7;cursor:pointer;}
.pg-list span.active{color:#4a6dff;font-weight:700;}
.pg-per-page{display:flex;align-items:center;gap:10px;}
.pg-per-page-label{font-size:14px;font-weight:500;color:#505968;letter-spacing:-.7px;}
.select-s{display:flex;align-items:center;gap:20px;height:36px;border:1px solid #d8d8d8;border-radius:5px;padding:10px;font-size:14px;font-weight:500;color:#505968;background:#fff;cursor:pointer;}
</style>
</head>
<body>

<main class="main">

<script>
// 정량(사용 빈도) + 정성(신규→단골 전환 효과) 지표를 약국 단위로 집계
// summaryCount: '복약지도 요약하기'를 눌러 실제 AI 요약을 생성한 횟수(정량 — 순수 사용 빈도)
// sendRegular/sendInvite: 실제 발송완료 건수(정량 — 단골/신규초대 채널별)
// inviteLinked/convRate: 신규초대 발송 후 단골로 전환된 건수/비율(정성 — 얼마나 "잘" 썼는지)
const rows = [
  { name:'○○약국', biz:'214-07-98765', summaryCount:52,  sendRegular:31,  sendInvite:15,  inviteLinked:4  },
  { name:'△△약국', biz:'458-19-77621', summaryCount:284, sendRegular:198, sendInvite:104, inviteLinked:49 },
  { name:'□□약국', biz:'267-34-90112', summaryCount:0,   sendRegular:0,   sendInvite:0,   inviteLinked:0  },
  { name:'☆☆약국', biz:'501-22-56784', summaryCount:201, sendRegular:142, sendInvite:73,  inviteLinked:37 },
  { name:'◇◇약국', biz:'112-63-88765', summaryCount:0,   sendRegular:0,   sendInvite:0,   inviteLinked:0  },
  { name:'♤♤약국', biz:'349-71-23409', summaryCount:58,  sendRegular:38,  sendInvite:19,  inviteLinked:5  },
  { name:'●●약국', biz:'478-05-12390', summaryCount:163, sendRegular:112, sendInvite:61,  inviteLinked:25 },
  { name:'▲▲약국', biz:'305-52-11234', summaryCount:9,   sendRegular:6,   sendInvite:3,   inviteLinked:0  },
  { name:'◆◆약국', biz:'130-88-34590', summaryCount:91,  sendRegular:61,  sendInvite:28,  inviteLinked:9  },
  { name:'▽▽약국', biz:'120-86-45231', summaryCount:126, sendRegular:83,  sendInvite:45,  inviteLinked:17 },
];

const COLUMNS = [
  { key:'no',           label:'NO',                  width:60,  group:'' },
  { key:'name',         label:'약국명',                width:160, group:'', sortable:true },
  { key:'biz',          label:'사업자 번호',            width:130, group:'', sortable:true },
  { key:'summaryCount', label:'AI 복약지도 요약 횟수',   width:150, group:'quant', sortable:true,
    tip:'선택한 월 기준, 퍼즐 AI 상담 중 "복약지도 요약하기"를 눌러 실제로 AI 요약을 생성한 횟수입니다. 녹음만 하고 요약을 생성하지 않은 세션은 집계하지 않습니다.' },
  { key:'sendRegular',  label:'복약상담 발송(단골)',      width:150, group:'quant', sortable:true,
    tip:'이미 등록된 단골 고객에게 실제로 발송 완료한 복약 상담 메시지 수입니다. 임시저장 상태는 포함하지 않습니다.' },
  { key:'sendInvite',   label:'복약상담 발송(신규초대)',   width:160, group:'quant', sortable:true,
    tip:'아직 가입하지 않은 신규 고객에게, 약사가 입력한 번호로 앱 설치 링크와 함께 보낸 복약 상담 메시지 수입니다. 발송 시점에 전화번호가 임시저장으로 남아, 이후 가입·단골 전환 여부를 이 번호 기준으로 매칭합니다.' },
  { key:'inviteLinked', label:'단골 전환수',            width:120, group:'qual', sortable:true,
    tip:'복약상담 신규초대로 임시저장된 전화번호가 가입과 동시에 이 약국의 단골로 자동 연결된 건수입니다. 복약 상담 발송 건에 한정해 집계됩니다(다른 경로의 신규 가입은 제외).' },
  { key:'convRate',     label:'단골 전환율',            width:120, group:'qual', sortable:true,
    tip:'단골 전환수를 복약상담 신규초대 발송 수로 나눈 비율입니다. (단골 전환수 ÷ 신규초대 발송 수 × 100) — 이 기능이 신규 고객을 단골로 만드는 데 얼마나 효과적인지를 보여주는 정성 지표입니다.' },
];

const cellRenderers = {
  no: (r, i) => `<td>${i + 1}</td>`,
  name: r => `<td class="strong">${r.name}</td>`,
  biz: r => `<td>${r.biz}</td>`,
  summaryCount: r => `<td class="strong">${r.summaryCount ? r.summaryCount + '회' : '—'}</td>`,
  sendRegular: r => `<td class="strong">${r.sendRegular ? r.sendRegular + '회' : '—'}</td>`,
  sendInvite: r => `<td class="strong">${r.sendInvite ? r.sendInvite + '회' : '—'}</td>`,
  inviteLinked: r => `<td class="strong">${r.inviteLinked ? r.inviteLinked + '명' : '—'}</td>`,
  convRate: r => {
    const cr = r.sendInvite ? Math.round((r.inviteLinked / r.sendInvite) * 100) : null;
    return `<td class="${cr ? 'conv-good' : 'conv-none'}">${cr === null ? '—' : cr + '%'}</td>`;
  },
};

const sortGetters = {
  name: r => r.name,
  biz: r => r.biz,
  summaryCount: r => r.summaryCount,
  sendRegular: r => r.sendRegular,
  sendInvite: r => r.sendInvite,
  inviteLinked: r => r.inviteLinked,
  convRate: r => r.sendInvite ? r.inviteLinked / r.sendInvite : -1,
};

let sortKey = null, sortDir = 1;

function renderThead() {
  // 원본 pharmacist_web_usage.html처럼 단일 헤더 행 + 컬럼별 width로만 구성.
  // 정량/정성 구분은 별도 그룹 행 없이 헤더 셀 배경색(group-quant/group-qual)으로만 표시
  document.getElementById('thead').innerHTML =
    '<tr>' + COLUMNS.map(c => {
      const tip = c.tip ? `<span class="th-tip" data-tip="${c.tip}">ⓘ</span>` : '';
      const sortBtn = c.sortable ? `<span class="sort-btn" data-key="${c.key}"><span class="tri tri-up">▲</span><span class="tri tri-down">▼</span></span>` : '';
      const cls = c.group === 'quant' ? ' class="group-quant"' : c.group === 'qual' ? ' class="group-qual"' : '';
      if (!tip && !sortBtn) return `<th${cls} style="width:${c.width}px;">${c.label}</th>`;
      return `<th${cls} style="width:${c.width}px;"><span class="th-label">${c.label}${tip}${sortBtn}</span></th>`;
    }).join('') + '</tr>';
  bindTooltips();
  bindSortButtons();
  updateSortIndicators();
}

function render() {
  document.getElementById('tbody').innerHTML = rows.map((r, i) =>
    '<tr>' + COLUMNS.map(c => cellRenderers[c.key](r, i)).join('') + '</tr>'
  ).join('');
  document.querySelector('.card-title .count').textContent = `(${rows.length})`;
}

function sortRows(key) {
  if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
  const get = sortGetters[key];
  rows.sort((a, b) => {
    const va = get(a), vb = get(b);
    if (typeof va === 'string') return va.localeCompare(vb) * sortDir;
    return (va - vb) * sortDir;
  });
  render();
  updateSortIndicators();
}

function updateSortIndicators() {
  document.querySelectorAll('.sort-btn').forEach(btn => {
    const up = btn.querySelector('.tri-up'), down = btn.querySelector('.tri-down');
    up.classList.remove('active');
    down.classList.remove('active');
    if (btn.dataset.key === sortKey) (sortDir === 1 ? up : down).classList.add('active');
  });
}

function bindSortButtons() {
  document.querySelectorAll('.sort-btn[data-key]').forEach(btn => {
    btn.addEventListener('click', () => sortRows(btn.dataset.key));
  });
}

const ttip = document.getElementById('ttip');
function bindTooltips() {
  document.querySelectorAll('.th-tip[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      ttip.textContent = el.getAttribute('data-tip');
      ttip.style.display = 'block';
      const r = el.getBoundingClientRect();
      const tw = ttip.offsetWidth, th = ttip.offsetHeight;
      let left = r.left + r.width / 2 - tw / 2;
      left = Math.max(8, Math.min(left, window.innerWidth - tw - 8));
      let top = r.top - th - 8;
      if (top < 8) top = r.bottom + 8;
      ttip.style.left = left + 'px';
      ttip.style.top = top + 'px';
    });
    el.addEventListener('mouseleave', () => { ttip.style.display = 'none'; });
  });
}

renderThead();
render();
</script>
