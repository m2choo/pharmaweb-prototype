    var usageLine = '1회 ' + d.dosage + ', ' + d.freq.replace('1일', '하루');
    return '<tr id="drow_' + rx.id + '_' + i + '">' +
      '<td>' + (i + 1) + '</td>' +
      '<td><div class="s2-drug-name">' + d.name + badge + warningTags + '</div><div class="s2-drug-sub">' + usageLine + '</div></td>' +
      '<td>' + d.days + '일분</td>' +
      '<td class="td-action">' +
        '<button class="s2-row-edit-btn" onclick="openEditRow(\'' + rx.id + '\',' + i + ')" title="편집">' + EDIT_ICON + '</button>' +
        '<button class="s2-row-del-btn" onclick="deleteDrug(\'' + rx.id + '\',' + i + ')" title="삭제">' + REMOVE_ICON + '</button>' +
      '</td>' +
    '</tr>';
  }).join('');
  var consentBlock = hasSub
    ? '<div class="s2-consent-row">' +
        '<div class="s2-consent-left">' +
          '<div class="s2-consent-icon"><span>!</span></div>' +
          '<div><div class="s2-consent-title">대체 조제인가요?</div><div class="s2-consent-sub">고객에게 대체조제 사실을 알려야 합니다.</div></div>' +
        '</div>' +
        '<div class="s2-consent-radios">' +
          '<label class="s2-consent-radio"><input type="radio" name="subConsent_' + rx.id + '" value="yes"> 네</label>' +
          '<label class="s2-consent-radio"><input type="radio" name="subConsent_' + rx.id + '" value="no"> 아니오</label>' +
        '</div>' +
      '</div>'
    : '';
  return '<div class="s2-rx-box">' +
    '<table class="s2-drug-table"><thead><tr><th>NO</th><th>약명</th><th>복용일</th><th class="th-action"></th></tr></thead>' +
    '<tbody id="drugTbody_' + rx.id + '">' + rows + '</tbody></table>' +
    '<div class="s2-add-drug-row"><button class="s2-add-drug-btn" onclick="openAddRow(\'' + rx.id + '\')">' + ADD_ICON + ' 약품 추가</button></div>' +
    consentBlock +
  '</div>';
}
function parseLeadingQty(str){
  var m = /^(\d+)\s*(.*)$/.exec((str || '').trim());
  return m ? { num: m[1], unit: m[2] || '정' } : { num: '1', unit: str || '정' };
}
function parseLeadingFreq(str){
  var m = /([0-9]+)\s*회/.exec(str || '');
  return m ? m[1] : '1';
}
function qtyFieldsHTML(prefix, dosage, freq, days){
  var d = parseLeadingQty(dosage);
  var freqNum = parseLeadingFreq(freq);
  return '<div class="s2-edit-qty-row">' +
    '<div class="s2-edit-qty-group"><label class="s2-edit-label">용량</label><div class="s2-edit-qty-value">1회 <input class="s2-edit-qty-input" id="' + prefix + '_dnum" type="number" min="1" value="' + d.num + '"> ' + d.unit + '</div></div>' +
    '<div class="s2-edit-qty-group"><label class="s2-edit-label">횟수</label><div class="s2-edit-qty-value">하루 <input class="s2-edit-qty-input" id="' + prefix + '_fnum" type="number" min="1" value="' + freqNum + '"> 회</div></div>' +
    '<div class="s2-edit-qty-group"><label class="s2-edit-label">일수</label><div class="s2-edit-qty-value"><input class="s2-edit-qty-input" id="' + prefix + '_days" type="number" min="1" value="' + days + '"> 일</div></div>' +
  '</div>';
}
function openEditRow(rxId, i){
  var key = rxId + '_' + i;
  var existing = document.getElementById('editForm_' + key);
  if(existing){ closeEditRow(key); return; }
  document.querySelectorAll('[id^="editForm_"]').forEach(function(el){ el.remove(); });
  var d = editingDrugsMap[rxId][i];
  var row = document.getElementById('drow_' + key);
  var formRow = document.createElement('tr');
  formRow.id = 'editForm_' + key;
  formRow.className = 's2-edit-row';
  formRow.innerHTML = '<td colspan="4"><div class="s2-edit-form">' +
    '<div><label class="s2-edit-label">약품 검색</label><div class="s2-edit-search">' +
      '<input id="ef_name_' + key + '" value="' + d.name + '">' +
      '<button class="clear-btn" onclick="document.getElementById(\'ef_name_' + key + '\').value=\'\'">' + CLEAR_ICON + '</button>' +
    '</div></div>' +
    qtyFieldsHTML('ef_' + key, d.dosage, d.freq, d.days) +
    '<div class="s2-edit-actions">' +
      '<button class="s2-edit-cancel" onclick="document.getElementById(\'editForm_' + key + '\').remove()">취소</button>' +
      '<button class="s2-edit-save" onclick="saveEditRow(\'' + rxId + '\',' + i + ')">저장</button>' +
    '</div>' +
  '</div></td>';
  row.after(formRow);
  document.getElementById('ef_name_' + key).focus();
}
function closeEditRow(key){
  var el = document.getElementById('editForm_' + key);
  if(el) el.remove();
}
function saveEditRow(rxId, i){
  var key = rxId + '_' + i;
  var prev = editingDrugsMap[rxId][i];
  var p = 'ef_' + key;
  var dNum = document.getElementById(p + '_dnum').value.trim();
  var dUnit = parseLeadingQty(prev.dosage).unit;
  var fNum = document.getElementById(p + '_fnum').value.trim();
  var days = parseInt(document.getElementById(p + '_days').value) || prev.days;
  editingDrugsMap[rxId][i] = {
    name: document.getElementById('ef_name_' + key).value.trim() || prev.name,
    dosage: (dNum || '1') + dUnit,
    freq: '1일 ' + (fNum || '1') + '회',
    days: days,
    sub: prev.sub
  };
  refreshExpandedRxItem();
}
function deleteDrug(rxId, i){
  if(!confirm('"' + editingDrugsMap[rxId][i].name + '" 을(를) 목록에서 삭제할까요?')) return;
  editingDrugsMap[rxId].splice(i, 1);
  refreshExpandedRxItem();
}
function openAddRow(rxId){
  var formId = 'addFormRow_' + rxId;
  if(document.getElementById(formId)) return;
  document.querySelectorAll('[id^="editForm_"]').forEach(function(el){ el.remove(); });
  var addRow = document.createElement('tr');
  addRow.id = formId;
  addRow.className = 's2-add-form-row';
  addRow.innerHTML = '<td colspan="4"><div class="s2-edit-form">' +
    '<div><label class="s2-edit-label">약품 검색</label><div class="s2-edit-search">' +
      '<input id="af_name_' + rxId + '" placeholder="약품명을 검색하세요.">' +
      '<button class="clear-btn" onclick="document.getElementById(\'af_name_' + rxId + '\').value=\'\'">' + CLEAR_ICON + '</button>' +
    '</div></div>' +
    qtyFieldsHTML('af_' + rxId, '1정', '1일 1회', 30) +
    '<div class="s2-edit-actions">' +
      '<button class="s2-edit-cancel" onclick="document.getElementById(\'' + formId + '\').remove()">취소</button>' +
      '<button class="s2-edit-save" onclick="saveAddRow(\'' + rxId + '\')">저장</button>' +
    '</div>' +
  '</div></td>';
  var table = document.getElementById('drugTbody_' + rxId).closest('table');
  var addBtnRow = table.nextElementSibling;
  addBtnRow.before(addRow);
  document.getElementById('af_name_' + rxId).focus();
}
function saveAddRow(rxId){
  var name = document.getElementById('af_name_' + rxId).value.trim();
  var p = 'af_' + rxId;
  var dNum = document.getElementById(p + '_dnum').value.trim() || '1';
  var fNum = document.getElementById(p + '_fnum').value.trim() || '1';
  var days = parseInt(document.getElementById(p + '_days').value) || 30;
  if(!name){ alert('약품명을 입력해 주세요.'); return; }
  editingDrugsMap[rxId].push({ name: name, dosage: dNum + '정', freq: '1일 ' + fNum + '회', days: days, sub: false });
  refreshExpandedRxItem();
}

/* 안내문구 — v3는 오른쪽 "상담 종료" 버튼, v2는 오른쪽 반짝이(요약) 버튼을 누르라고 안내. pzStyle 전환 시 setPzStyle()에서도 재사용.
   탭바 바로 아래 상단 고정 스트립(#consultHintBar)에 표시 — 녹음 상태(웨이브/타이머)는 오른쪽 퍼즐 AI 패널에서
   이미 보이므로 왼쪽 본문엔 별도 상태 배너를 두지 않고 "다음에 뭘 해야 하는지"만 안내 */
function buildHintInnerHtml(){
  return pzStyle === 'v2'
    ? '상담이 끝나면 오른쪽 <img class="rec-hint-icon" src="i_puzzleai.png" alt="AI 요약 버튼">를 눌러주세요. AI 요약 후 복약지도문 탭으로 이동합니다.'
    : '상담이 끝나면 오른쪽 <b>"상담 종료"</b>를 눌러주세요. AI 요약 후 복약지도문 탭으로 이동합니다.';
}
function showConsultHintBar(){
  document.getElementById('consultHintText').innerHTML = buildHintInnerHtml();
  document.getElementById('consultHintBar').style.display = '';
}
function hideConsultHintBar(){
  document.getElementById('consultHintBar').style.display = 'none';
}
/* ── 녹음 화면 본문(상담 내용 요약 + 다제약물 근거) — 상담 내용 요약/안내문구는 신규·단골 공통, 다제약물 근거는 처방 이력이 있는 단골만 ── */
function renderMainRecordingContent(){
  /* 처방전확인 단계(상담 유형 선택: 일반·건강 상담/처방약 상담)를 거쳐 온 경우에만 그 화면으로 돌아갈 "이전" 버튼을 둠 —
     처음부터 신규로 시작해 그 화면 자체가 없었던 경우엔 되돌아갈 곳이 없으므로 버튼도 없음.
     "다음"은 상담 종료와 동일하게 요약으로 넘어가는 버튼 — AI가 요약할 내용(STT 인식)이 아직 안 들어왔으면
     비활성 상태로 두고, appendSttLine()에서 인식이 끝나는 시점에 enableConsultNextBtn()으로 활성화함 */
  document.getElementById('mfoot').innerHTML =
    (hadInlineRxCheck ? '<button class="btn-back" onclick="showInlineRxCheck()">이전</button>' : '') +
    '<!-- component: button/solid --><button class="btn-next" data-figma="button/solid" id="btnConsultNext"' +
      (sttIndex >= STT_LINES.length ? '' : ' disabled') + ' onclick="endRecording()">다음</button>';
  var memoBlock =
    '<!-- component: new/pharmacist-memo --><div class="pharmacist-memo" data-figma="new/pharmacist-memo">' +
      '<div class="memo-hd">' +
        '<span class="memo-hd-title">' +
          '<span class="memo-icon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M6 3h9l5 5v13a1 1 0 01-1 1H6a1 1 0 01-1-1V4a1 1 0 011-1z" stroke="#F5AC1F" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 12h6M9 16h6" stroke="#F5AC1F" stroke-width="1.8" stroke-linecap="round"/></svg></span>' +
          '약사 메모' +
        '</span>' +
        '<span class="memo-autosave">자동 저장됨</span>' +
      '</div>' +
      '<textarea class="memo-textarea" id="pharmacistMemo" maxlength="1000" oninput="saveMemo()" placeholder="상담 중 참고할 내용을 자유롭게 메모해 보세요.&#10;예) 고객 특이사항, 다음 상담 시 확인할 점 등"></textarea>' +
      '<div class="memo-count" id="memoCount">0 / 1,000</div>' +
    '</div>';
  showConsultHintBar();
  if(selectedPatient.isNew){
    /* 신규는 참고할 처방 이력이 없어 다제약물 근거 표는 생략 — 녹음 상태(웨이브/타이머)는 오른쪽 퍼즐 AI
       패널에서 이미 보이므로 왼쪽 본문엔 중복해서 두지 않음 */
    document.getElementById('mbody').innerHTML = memoBlock;
  } else {
    document.getElementById('mbody').innerHTML =
      renderPolyAlertHtml(selectedPatient) +
      memoBlock +
      renderRxDrugListHtml() +
      renderPolyDrugTableHtml(selectedPatient);
  }
  /* 기본 예시 메모는 이전 방문 이력이 있는 단골에게만 자연스러움 — 신규 고객은 참고할 이전 상담이
     없으므로 빈 칸으로 둠 */
  var savedMemo = localStorage.getItem(getMemoKey());
  var fallbackMemo = selectedPatient.isNew ? '' : DEFAULT_PHARMACIST_MEMO;
  document.getElementById('pharmacistMemo').value = savedMemo !== null ? savedMemo : fallbackMemo;
  updateMemoCount();
}

/* ── 퍼즐 AI 패널 헤더(이름+나이/방문정보 바) 갱신 — v2 스타일에서만 나이/방문정보 바를 보여줌, v3 원본은 이름만 ── */
function computeAge(birth){
  return birth ? (new Date().getFullYear() - parseInt(birth.slice(0,4), 10) + 1) : null;
}
function updatePzIdentity(){
  var p = selectedPatient;
  var age = (pzStyle === 'v2' && !p.isNew) ? computeAge(p.birth) : null;
  document.getElementById('pzName').textContent = (p.name || '신규 고객') + (age ? ' (' + age + '세)' : '');
  var visitBar = document.getElementById('pzVisitBar');
  var hist = p.rxHistory || [];
  if(pzStyle === 'v2' && !p.isNew && hist.length){
    var maxDate = hist.reduce(function(m, rx){ return rx.date > m ? rx.date : m; }, hist[0].date);
    visitBar.style.display = '';
    document.getElementById('pzVisit').textContent = hist.length + '회 방문 · 최근 ' + maxDate.slice(2).replace(/-/g,'.') + ' · 처방전 ' + hist.length + '건';
  } else {
    visitBar.style.display = 'none';
  }
}
/* QA 드롭다운에서 패널 디자인을 바꿀 때 호출 — 녹음 중이면 STT로 이미 인식된 텍스트를 보존한 채 헤더/녹음표시/하단바만 다시 그림 */
function setPzStyle(v){
  pzStyle = v;
  if(!recordingActive) return;
  var prevBox = document.getElementById('sttBox');
  var prevHtml = prevBox ? prevBox.innerHTML : '';
  renderPzRecordingChrome();
  var newBox = document.getElementById('sttBox');
  if(newBox) newBox.innerHTML = prevHtml;
  /* 반짝이 아이콘은 v2 스타일 전용 — 전환 시 새 스타일 기준으로 있어야/없어야 할 상태를 맞춤 */
  var existingIcon = newBox && newBox.querySelector('.pz-stt-writing-icon');
  if(pzStyle === 'v2' && !existingIcon && newBox){
    newBox.insertAdjacentHTML('beforeend', '<img class="pz-stt-writing-icon" src="i_puzzleai.png" alt="AI 인식 중" title="눌러서 복약지도문 생성" onclick="endRecording()">');
  } else if(pzStyle !== 'v2' && existingIcon){
    existingIcon.remove();
  }
  var hintEl = document.getElementById('consultHintText');
  if(hintEl) hintEl.innerHTML = buildHintInnerHtml();
}
/* 녹음 중 퍼즐 AI 패널의 헤더/녹음표시/하단바를 pzStyle에 맞게 그림 — beginRecording()과 setPzStyle() 양쪽에서 재사용 */
function renderPzRecordingChrome(){
  updatePzIdentity();
  var isNew = selectedPatient.isNew;
  /* 녹음 중 점멸 표시(빨간 점+"녹음 중"+타이머)는 v2/v3 둘 다 제거 — 실시간 STT 텍스트가 흘러가는 것
     자체로 녹음 중임이 드러나므로 중복 상태 표시를 두지 않음 */
  document.getElementById('pzRecBar').style.display = 'none';
  document.getElementById('pzSub').style.display = '';
  document.getElementById('pzSub').textContent = isNew ? '녹음이 시작되었습니다' : ('상담이 진행 중입니다 ' + fmtTime(seconds));
  var pzBody = document.getElementById('pzBody');
  pzBody.style.alignItems = 'stretch';
  pzBody.style.justifyContent = 'flex-start';
  /* 웨이브 표시는 없애고 실시간 STT 인식 텍스트만 — 대화가 흘러가는 것 자체가 녹음 중임을 보여줌 */
  pzBody.innerHTML = '<div class="pz-stt-box" id="sttBox"></div>';
  if(pzStyle === 'v2'){
    document.getElementById('pzFooter').innerHTML =
      '<div class="pz-bottom">' +
        '<div class="pz-input-row">' +
          '<!-- component: button/solid --><button class="pz-mic-btn" data-figma="button/solid" id="btnStop" onclick="endRecording()" title="상담 종료">' +
            '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="8.5" y="1" width="7" height="11" rx="3.5" fill="#FFFFFF"/><path d="M5 11c0 3.866 3.134 7 7 7s7-3.134 7-7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><path d="M12 18v3M9 21h6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/></svg>' +
          '</button>' +
          '<div class="pz-input-box">' +
            '<span class="pz-input">AI 버튼을 누르면 기록지가 생성돼요.</span>' +
            '<div class="pz-wave"><span></span><span></span><span></span><span></span><span></span></div>' +
          '</div>' +
        '</div>' +
      '</div>';
  } else {
    document.getElementById('pzFooter').innerHTML =
      '<!-- component: button/solid --><button class="btn-stop" data-figma="button/solid" id="btnStop" onclick="endRecording()">' +
        '<svg width="13" height="13" viewBox="0 0 24 24" fill="#FFFFFF"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>' +
        '상담 종료</button>';
  }
}

/* ── 고객 선택 즉시 녹음 시작 (신규는 이름 미확정 상태로, 단골 전환은 convertToExistingPatient가 처리) ── */
/* 신규/단골 공통 "녹음 중" 상태의 step 라벨 — 처방전 확인이 끝나고 돌아올 때도 재사용 */
function applyRecordingStepLabels(){
  document.getElementById('st1').innerHTML = '<span class="step-num">1</span> 복약 상담';
  document.getElementById('st2').innerHTML = '<span class="step-num">2</span> 복약지도문 작성';
  var st3 = document.getElementById('st3');
  if(selectedPatient.isNew){
    st3.style.display = '';
    st3.innerHTML = '<span class="step-num">3</span> 전화번호 입력';
  } else {
    st3.style.display = 'none';
  }
}
function beginRecording(){
  document.getElementById('stepTabs').style.display = '';
  /* 상담 종료 전까지는 이름 변경/삭제(X) 모두 자유롭게 가능 */
  renderModalPtBar(true);
  setStep(1);
  applyRecordingStepLabels();
  renderMainRecordingContent();
  startRecordingEngine();
}
/* beginRecording()에서 실제 녹음 엔진(타이머·STT·우측 패널) 기동 부분만 분리 —
   처방전 확인(showInlineRxCheck)을 먼저 거쳐야 하는 진입 경로(openModalAtStep2)에서
   확인 전에는 녹음을 시작하지 않고, 확인 완료 시점에만 이 함수를 호출하기 위함 */
function startRecordingEngine(){
  recordingActive = true;
  seconds = 0;
  renderPzRecordingChrome();
  startStt();
  clearInterval(timerId);
  timerId = setInterval(function(){
    seconds++;
    var t = fmtTime(seconds);
    var recTimerEl = document.getElementById('recTimer');
    if(recTimerEl) recTimerEl.textContent = t;
    if(pzStyle === 'v2'){
      var pzTimerEl = document.getElementById('pzTimer');
      if(pzTimerEl) pzTimerEl.textContent = t;
    } else if(!selectedPatient.isNew){
      var pzSubEl = document.getElementById('pzSub');
      if(pzSubEl) pzSubEl.textContent = '상담이 진행 중입니다 ' + t;
    }
  }, 1000);
}
function updateMemoCount(){
  var el = document.getElementById('pharmacistMemo');
  document.getElementById('memoCount').textContent = el.value.length + ' / 1,000';
}
/* 상담 내용 요약은 고객 상세 페이지(customer_info_v3.html)의 상담 내용 요약과 이름 기준으로 localStorage를 공유 — 여기서 쓰면 상세 페이지에도 그대로 반영됨 */
function getMemoKey(){
  return 'pharmacistMemo_' + ((selectedPatient && selectedPatient.name) || '');
}
function saveMemo(){
  localStorage.setItem(getMemoKey(), document.getElementById('pharmacistMemo').value);
  updateMemoCount();
}

function endRecording(){
  clearInterval(timerId);
  clearInterval(sttTimer);
  recordingActive = false;
  var cursor = document.querySelector('.pz-stt-cursor');
  if(cursor) cursor.remove();
  var writingIcon = document.querySelector('.pz-stt-writing-icon');
  if(writingIcon) writingIcon.remove();
  document.getElementById('btnStop').disabled = true;
  var recCircleEl = document.getElementById('recCircle');
  if(recCircleEl) recCircleEl.classList.add('done');
  document.getElementById('pzRecBar').style.display = 'none';
  document.getElementById('pzSub').style.display = '';
  updatePzIdentity();
  document.getElementById('pzSub').textContent = '상담 내용을 요약했습니다';
  consultCompleted = true;
  /* 실제 고객 데이터가 확정된 단골(isNew===false)은 이 시점부터 이름 변경/삭제 모두 잠금 — 이미 그 고객의
     처방 이력 기준으로 상담·요약이 끝났으므로 되돌릴 수 없음. 신규(닉네임만 있던) 고객은 계속 클릭 가능하게
     열어두되, 실제로 바꾸거나 삭제하면 commitEditName/removePatient에서 확인창을 거쳐 임시저장 후 리셋됨 */
  renderModalPtBar(!selectedPatient.isNew ? false : true);
  goSummary();
}
function goSummary(){
  hideConsultHintBar();
  setStep(hadInlineRxCheck ? 3 : 2);
  var isKnown = selectedPatient.phone && !selectedPatient.isNew;
  var activeRxs = selectedPatient.isNew ? [] : getSelectedRxs();
  activeRxs.forEach(initReminderSettingsFor);
  var draft = currentDraft !== null ? currentDraft : buildAiDraft();
  var taBlock =
    '<!-- component: new/message-draft --><textarea class="msg-ta" id="draftText" data-figma="new/message-draft" oninput="updateMsgCount()">' + draft + '</textarea>' +
    '<div class="msg-cnt" id="msgCnt"></div>';
  var bodyContent;
  if(isKnown && activeRxs.length){
    bodyContent = '<div id="reminderCardWrap"></div>' + taBlock;
  } else {
    bodyContent = taBlock;
  }
  var chkRow = '<div class="msg-chk-row">' +
    buildMsgChipHtml('summary', 'AI 요약 내용', msgIncludeSummary) +
    (hasRxInfoAvailable() ? buildMsgChipHtml('rx', '처방약 정보', msgIncludeRx) : '') +
  '</div>';
  document.getElementById('mbody').innerHTML =
    '<div class="msg-hdr"><span class="msg-ttl">복약지도문 작성</span></div>' +
    '<div class="ai-caption">AI가 요약한 초안입니다 — 자유롭게 수정하세요. 포함할 내용을 추가/삭제할 수 있습니다.</div>' +
    chkRow +
    bodyContent;
  if(isKnown && activeRxs.length) renderReminderCardWrap();
  updateMsgCount();
  document.getElementById('mfoot').innerHTML = isKnown
    ? '<!-- component: button/solid --><button class="btn-next send" data-figma="button/solid" onclick="sendKnownDirect()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>앱으로 보내기</button>'
    : '<!-- component: button/solid --><button class="btn-next" data-figma="button/solid" onclick="goSend()">다음</button>';
}
function updateMsgCount(){
  var len = document.getElementById('draftText').value.length;
  document.getElementById('msgCnt').textContent = len + '자';
}
/* 복약지도문 작성 화면의 AI 요약 내용/처방약 정보/다제약물 정보 토글 — 작은 체크박스는 클릭이 잘 안 먹는다는
   피드백으로 큼직한 칩(버튼) 형태로 변경, 누르면 그대로 켜짐/꺼짐이 뒤바뀌고 초안을 다시 생성 */
var MSG_CHIP_CHECK_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function buildMsgChipHtml(key, label, on){
  return '<button type="button" class="msg-chk-btn' + (on ? ' on' : '') + '" data-key="' + key + '" onclick="toggleMsgChip(this)">' +
    '<span class="msg-chk-icon">' + MSG_CHIP_CHECK_ICON + '</span>' + label +
  '</button>';
}
function toggleMsgChip(btn){
  var on = !btn.classList.contains('on');
  btn.classList.toggle('on', on);
  var key = btn.dataset.key;
  if(key === 'summary') msgIncludeSummary = on;
  else if(key === 'rx') msgIncludeRx = on;
  document.getElementById('draftText').value = buildAiDraft();
  updateMsgCount();
}
function sendKnownDirect(){
  currentDraft = document.getElementById('draftText').value;
  savePolyRecordIfQualifying();
  renderComplete(selectedPatient.name+'님의 웰체크 앱으로 복약지도문이 발송되었습니다.');
}

/* ── 전화번호 입력 — 신규 고객 전용(단골은 goSummary에서 바로 발송) ── */
var PHARMACY_PHONE = '02-1234-5678';
function goSend(){
  setStep(3);
  currentDraft = document.getElementById('draftText').value;
  var rightCol =
    '<!-- component: new/send-summary-table --><table class="sum-tbl" data-figma="new/send-summary-table">' +
      '<tr><td>발송 채널</td><td>문자(SMS)</td></tr>' +
      '<tr><td>약국 번호</td><td>'+PHARMACY_PHONE+'</td></tr>' +
    '</table>' +
    '<div class="field"><label>고객 연락처 <span class="req">(필수)</span></label>' +
      '<!-- component: new/phone-input-big --><input id="sendPhone" class="phone-input-big" data-figma="new/phone-input-big" type="tel" inputmode="numeric" placeholder="010-0000-0000" maxlength="13" oninput="formatPhoneInput(this);checkSendEnabled();">' +
      '</div>' +
    '<!-- component: new/consent-checkbox --><label class="consent-row" data-figma="new/consent-checkbox">' +
      '<input type="checkbox" id="smsConsent" onchange="checkSendEnabled()"> 수신자에게 초대 문자 발송 및 정보 제공에 대한 동의를 받았습니다.' +
    '</label>';
  document.getElementById('mbody').innerHTML = '<div class="send-summary-label">전화번호 입력</div>' + rightCol;
  document.getElementById('mfoot').innerHTML =
    '<button class="btn-back" onclick="goSummary()">이전</button>' +
    '<!-- component: button/solid --><button class="btn-next send" id="btnSend" data-figma="button/solid" disabled onclick="doSend()">' +
    '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>문자로 보내기</button>';
  document.getElementById('sendPhone').focus();
}
function formatPhoneInput(el){
  var d = el.value.replace(/\D/g,'').slice(0,11);
  var out = d;
  if(d.length > 3 && d.length <= 7) out = d.slice(0,3) + '-' + d.slice(3);
  else if(d.length > 7) out = d.slice(0,3) + '-' + d.slice(3,7) + '-' + d.slice(7);
  el.value = out;
}
function checkSendEnabled(){
  var phone = document.getElementById('sendPhone').value.replace(/\D/g,'');
  var consented = document.getElementById('smsConsent').checked;
  document.getElementById('btnSend').disabled = phone.length !== 11 || !consented;
}
function doSend(){
  selectedPatient.phone = document.getElementById('sendPhone').value || selectedPatient.phone;
  savePolyRecordIfQualifying();
  renderComplete(selectedPatient.phone+'로 복약지도문과 웰체크 앱 초대 링크가 문자(SMS)로 발송되었습니다.');
}
function goToPolyRecord(){
  var target = 'poly_consult_record_v3.html?open=' + encodeURIComponent(lastPolyRecordId);
  if(window.top && window.top !== window) window.top.location.href = target;
  else window.location.href = target;
}
function renderComplete(cplSub){
  var polyBtn = lastPolyRecordId
    ? '<button class="btn-poly-record" onclick="goToPolyRecord()">다제약물 상담기록지 확인</button>'
    : '';
  document.getElementById('mbody').innerHTML =
    '<div class="cpl-wrap">' +
      '<div class="cpl-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4L19 6" stroke="#33AF2E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
      '<div class="cpl-ttl">전송이 완료되었습니다</div>' +
      '<div class="cpl-sub">'+cplSub+'</div>' +
      polyBtn +
    '</div>';
  document.getElementById('mfoot').innerHTML =
    '<button class="btn-close-cpl" onclick="closeModal()">확인</button>';
}

if(window.parent && window.parent !== window){
  var standaloneFab = document.getElementById('standaloneFab');
  if(standaloneFab) standaloneFab.style.display = 'none';
}
</script>

</body>
